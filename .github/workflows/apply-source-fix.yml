name: Aplicar correção pontual do AppV3

on:
  push:
    branches:
      - feat/fluxo-caixa-historico-admin

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fluxo-caixa-historico-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-appv3-source.mjs
      - name: Commit source fix if needed
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV3.tsx
          git commit -m "fix: corrigir JSX do dashboard gerencial"
          git push origin HEAD:feat/fluxo-caixa-historico-admin
