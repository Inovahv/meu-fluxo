<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* ============ v11: interface enxuta e móvel ============ */
/* hierarquia: títulos de cartão mais firmes, respiro consistente */
.card-head h2{font-size:.98rem;font-weight:650;letter-spacing:-.005em}
.card{border-color:color-mix(in srgb,var(--border) 80%,transparent)}
.topbar{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.kpi-value{font-size:1.6rem}
.kpi-label{letter-spacing:.005em}

/* botão de filtros: só no celular */
.btn-filtros{display:none;gap:7px}
.btn-filtros .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:.72rem;font-weight:700;display:inline-grid;place-items:center}
.btn-filtros[aria-expanded="true"]{border-color:var(--accent);color:var(--brand-2)}
.filtros-barra{display:flex;justify-content:flex-end;margin-bottom:10px}

/* barra inferior: só no celular */
.tabbar{display:none}

@media (max-width:900px){
  .btn-filtros{display:inline-flex}
  .filtros-mob:not(.aberto){display:none !important}
  .filtros-mob.aberto{animation:abreFiltros .16s ease-out}
  .scope-quick{justify-content:space-between;margin-bottom:10px}
  .scope-quick>.tiny.muted:first-child{display:none}
  .scope-quick #escopoResumo{order:3;flex-basis:100%;margin-top:-2px}

  /* Visão geral no celular: KPIs e gráficos primeiro */
  #page-visao-geral.page.active{display:flex;flex-direction:column}
  #page-visao-geral>.scope-quick{order:1}
  #page-visao-geral>#vgFiltros{order:2;margin-bottom:12px !important}
  #page-visao-geral>#scopeNote{order:3}
  #page-visao-geral>#kpis{order:4}
  #page-visao-geral>#cardEvo{order:5;margin-top:12px !important}
  #page-visao-geral>#cardCategoria{order:6;margin-top:12px !important}
  #page-visao-geral>#fraseDia{order:7;margin:12px 0 0}
  #page-visao-geral>#cardAtencao{order:8;margin-top:12px !important}
  #page-visao-geral>#cardUltimos{order:9;margin-top:12px !important}

  /* os quatro KPIs cabem na primeira tela */
  #kpis.kpi-row.scroller{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;padding-bottom:0;margin-bottom:0}
  #kpis.kpi-row.scroller .kpi{flex:none;padding:11px 12px;gap:4px}
  #kpis .kpi-value{font-size:1.14rem}
  #kpis .kpi-label{font-size:.74rem}
  #kpis .kpi-foot{font-size:.7rem}
  #kpis .kpi-foot>span:not(.trend):not(.badge){display:none}
  #kpis .kpi-value-row svg,#kpis .kpi>.tiny.muted{display:none}

  /* barra inferior ao alcance do polegar */
  .menu-btn{display:none !important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:grid;justify-items:center;gap:3px;border:0;background:transparent;color:var(--ink-2);
    font:inherit;font-size:.68rem;padding:4px 2px;border-radius:10px;cursor:pointer;min-height:48px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--brand-2);font-weight:650}
  :root[data-theme="dark"] .tabbar button[aria-current="page"],:root:not([data-theme="light"]) .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button:focus-visible{box-shadow:var(--focus)}
  .tabbar .tab-novo{align-self:center}
  .tabbar .tab-novo span.bola{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--brand-2);color:#fff;
    box-shadow:0 6px 16px -6px rgba(12,31,37,.55);margin-top:-18px}
  .tabbar .tab-novo span.bola svg{width:24px;height:24px}
  .content{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

  /* formulário: rodapé fixo e só o essencial à vista */
  .modal-card .modal-foot{position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:900px) and (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn-filtros[aria-expanded="true"]{color:var(--accent)}
}
@keyframes abreFiltros{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.filtros-mob.aberto{animation:none}}

/* "Mais opções" no formulário */
.mais-opcoes{grid-column:1/-1;border:1px dashed var(--border);border-radius:var(--r-sm);padding:2px 12px}
.mais-opcoes>summary{cursor:pointer;padding:9px 0;font-size:.86rem;color:var(--ink-2);font-weight:550;list-style:none}
.mais-opcoes>summary::-webkit-details-marker{display:none}
.mais-opcoes>summary::before{content:"+ ";font-weight:700}
.mais-opcoes[open]>summary::before{content:"− "}
.mais-opcoes .form-grid{padding-bottom:10px}

<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071519" media="(prefers-color-scheme: dark)">
<title>Meu Fluxo — Finanças da casa</title>
<meta name="description" content="Gestão financeira pessoal e do casal, com login por perfil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============ 1. Tokens ============ */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --surface-2:#E9F0F2; --surface-3:#DCE7EA;
  --border:#D3E0E4; --border-strong:#B2C6CD;
  --ink:#0C1F25; --ink-2:#41616A; --ink-3:#6C858C;
  --brand:#0E3B45; --brand-2:#15626F; --brand-ink:#FFFFFF; --accent:#1B8FA3; --accent-soft:#E2F1F4;
  --pos:#0A6E4A; --pos-bg:#E1F2EA; --neg:#A93325; --neg-bg:#FAE9E7; --warn:#7C5300; --warn-bg:#FBF0D9;
  --shadow-1:0 1px 2px rgba(12,31,37,.06);
  --shadow-2:0 1px 2px rgba(12,31,37,.05), 0 10px 24px -14px rgba(12,31,37,.35);
  --r:14px; --r-sm:9px; --r-xs:6px;
  --sidebar-w:252px; --topbar-h:64px;
  --focus:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071519; --surface:#0F262D; --surface-2:#163039; --surface-3:#1D3C46;
    --border:#20424D; --border-strong:#2E5A67;
    --ink:#E8F1F3; --ink-2:#A6BDC4; --ink-3:#7E989F;
    --brand:#1B6675; --brand-2:#24808F; --brand-ink:#F2FBFC; --accent:#4FB9CC; --accent-soft:#12333C;
    --pos:#57C79A; --pos-bg:#0F332A; --neg:#F08A7C; --neg-bg:#38201D; --warn:#E0B767; --warn-bg:#33280F;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071519; --surface:#0F262D; --surface-2:#163039; --surface-3:#1D3C46;
  --border:#20424D; --border-strong:#2E5A67;
  --ink:#E8F1F3; --ink-2:#A6BDC4; --ink-3:#7E989F;
  --brand:#1B6675; --brand-2:#24808F; --brand-ink:#F2FBFC; --accent:#4FB9CC; --accent-soft:#12333C;
  --pos:#57C79A; --pos-bg:#0F332A; --neg:#F08A7C; --neg-bg:#38201D; --warn:#E0B767; --warn-bg:#33280F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

/* ============ 2. Base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.011em; line-height:1.25}
h1{font-size:1.35rem}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:0 0 .5rem}
a{color:var(--brand-2)}
:root[data-theme="dark"] a, :root:not([data-theme="light"]) a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:none; box-shadow:var(--focus); border-radius:var(--r-xs)}
.money{font-variant-numeric:tabular-nums; letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.tiny{font-size:.78rem}
.small{font-size:.85rem}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ 3. Login ============ */
.login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;
  background:
    radial-gradient(1000px 520px at 12% -10%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 62%),
    radial-gradient(760px 420px at 100% 110%, color-mix(in srgb,var(--brand) 30%, transparent), transparent 60%),
    var(--bg);
  overflow:auto}
.login-card{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow-2);padding:28px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--brand-2),var(--brand));
  display:grid;place-items:center;color:#fff;flex:none}
.logo-mark svg{width:20px;height:20px}
.logo-name{font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.badge-demo{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 32%, transparent);padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:600}
.user-pick{display:grid;gap:10px;margin:18px 0 14px}
.user-btn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.user-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.tag.dono{background:var(--accent-soft);color:var(--brand-2);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
:root[data-theme="dark"] .tag.dono,:root:not([data-theme="light"]) .tag.dono{color:var(--accent)}
.so-leitura{color:var(--ink-3);cursor:default}
.so-leitura svg{width:15px;height:15px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;
  background:var(--surface-3);color:var(--brand-2);font-size:.9rem}
:root[data-theme="dark"] .avatar,:root:not([data-theme="light"]) .avatar{color:var(--accent)}

.login-perfis{display:grid;gap:10px;margin:18px 0 6px}
.login-voltar{border:0;background:transparent;color:var(--ink-2);cursor:pointer;padding:4px 0;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.login-voltar svg{width:14px;height:14px}
.login-erro{color:var(--neg);font-size:.85rem;min-height:1.2em}
.login-form{display:grid;gap:12px;margin-top:16px}
.user-btn[disabled]{opacity:.6;cursor:wait}
.user-btn .tag{margin-left:auto}
.link-btn{border:0;background:transparent;color:var(--brand-2);cursor:pointer;padding:2px 0;font-size:.85rem;font-weight:600}
:root[data-theme="dark"] .link-btn,:root:not([data-theme="light"]) .link-btn{color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.sync[data-st="salvando"] i{background:var(--warn)}
.sync[data-st="erro"] i{background:var(--neg)}
.sync[data-st="erro"]{color:var(--neg)}
.sync[data-modo="local"] i{background:var(--ink-3)}
.casal-seg button{padding:6px 12px}
.casal-bar{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:.86rem}
.casal-bar svg{width:18px;height:18px;flex:none;color:var(--brand-2);margin-top:1px}
.frase-dia{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);
  border:1px solid var(--border);background:linear-gradient(120deg,var(--surface-2),var(--surface) 70%);color:var(--ink-2)}
.frase-dia svg{width:17px;height:17px;flex:none;color:var(--accent);opacity:.9}
.frase-dia p{margin:0;font-size:.88rem;line-height:1.45}
.frase-dia b{color:var(--ink);font-weight:600}
.aviso-senha{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:9px 12px;border-radius:var(--r);
  background:var(--warn-bg);color:var(--warn);font-size:.85rem;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.aviso-senha svg{width:17px;height:17px;flex:none}
.aviso-senha span{flex:1}
.aviso-senha .link-btn{color:inherit;text-decoration:underline;font-weight:600}
.campo-senha{position:relative}
.campo-senha .input{padding-right:44px}
.olho{position:absolute;right:4px;bottom:4px;width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;
  border-radius:var(--r-xs);cursor:pointer;color:var(--ink-2)}
.olho:hover{color:var(--ink);background:var(--surface-2)}
.olho:focus-visible{box-shadow:var(--focus)}
.olho svg{width:18px;height:18px}
.tag-toggle{border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font:inherit;font-size:.72rem;
  padding:2px 9px;border-radius:999px;color:var(--ink-2)}
.tag-toggle:hover{border-color:var(--accent);color:var(--ink)}
.veic-lista{display:grid;gap:6px;padding:4px 14px 10px}
.veic-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)}
.kv-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:4px 14px 10px}
.kv-row>div{display:grid;gap:2px}
.kv-row b{font-size:1.05rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){.kv-row{grid-template-columns:1fr 1fr}}
.tag-toggle:focus-visible{box-shadow:var(--focus)}
.tag-toggle.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--brand-2);font-weight:600}
:root[data-theme="dark"] .tag-toggle.ok,:root:not([data-theme="light"]) .tag-toggle.ok{color:var(--accent)}
@media (max-width:560px){.frase-dia{padding:10px 12px}.frase-dia p{font-size:.84rem}}
:root[data-theme="dark"] .casal-bar svg,:root:not([data-theme="light"]) .casal-bar svg{color:var(--accent)}

/* ============ 4. Shell ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--brand);color:#EAF6F8;display:flex;flex-direction:column;gap:6px;padding:16px 12px;
  position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .logo{color:#fff;padding:6px 8px 14px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:#CBE4E9;
  background:transparent;border:0;cursor:pointer;text-align:left;font-size:.92rem;font-weight:500;width:100%}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent)}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.14);padding:12px 8px 4px;font-size:.76rem;color:#A9CBD2}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:10px;
  padding:0 20px;background:color-mix(in srgb,var(--surface) 88%, transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.1rem}
.top-sub{font-size:.76rem;color:var(--ink-3);margin-top:1px}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--neg);
  border:2px solid var(--surface)}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.user-chip .avatar{width:28px;height:28px;font-size:.72rem}
.content{padding:20px;max-width:1460px;width:100%;margin:0 auto}
.page{display:none}
.page.active{display:block}
.menu-btn{display:none}

/* ============ 5. Botões / campos ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:500;font-size:.88rem;cursor:pointer;
  transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn-danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent)}
.btn-danger:hover{background:var(--neg-bg)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:.79rem;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:.9rem}
select.input{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px}
.input-money{font-variant-numeric:tabular-nums;font-weight:600}
.with-prefix{position:relative}
.with-prefix .prefix{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:.9rem;pointer-events:none}
.with-prefix .input{padding-left:36px}
.err{color:var(--neg);font-size:.76rem;min-height:0}
.input[aria-invalid="true"]{border-color:var(--neg)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}

<script>
"use strict";
/* =========================================================================
   Meu Fluxo — finanças da casa
   Bloco 1: utilitários, catálogo e perfis
   ========================================================================= */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pad=n=>String(n).padStart(2,'0');
const round2=v=>Math.round((v+Number.EPSILON)*100)/100;
const cents=v=>Math.round(v*100);
const somaV=list=>list.reduce((a,l)=>a+cents(l.valor),0)/100;
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const NUM=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=v=>BRL.format(v||0);
const fmtCompacto=v=>{const a=Math.abs(v);if(a>=1000000)return (v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if(a>=1000)return (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';return NUM.format(v||0);};
const fmtPct=v=>(v>=0?'+':'−')+NUM.format(Math.abs(v))+'%';

/* ---- datas (armazenadas como AAAA-MM-DD) ---- */
function ultimoDia(y,m){return new Date(y,m,0).getDate();}
function ymd(y,m,d){const t=y*12+(m-1);y=Math.floor(t/12);m=t%12+1;return `${y}-${pad(m)}-${pad(Math.min(d,ultimoDia(y,m)))}`;}
function pYMD(s){const[a,b,c]=s.split('-').map(Number);return{y:a,m:b,d:c};}
function fmtData(s){if(!s)return '—';const p=pYMD(s);return `${pad(p.d)}/${pad(p.m)}/${p.y}`;}
function fmtDataCurta(s){const p=pYMD(s);return `${pad(p.d)}/${pad(p.m)}`;}
function hojeStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addMeses(s,n){const p=pYMD(s);return ymd(p.y,p.m+n,p.d);}
function mesIndex(s){const p=pYMD(s);return p.y*12+(p.m-1);}
function mesLabel(idx,curto=true){const y=Math.floor(idx/12),m=idx%12;return curto?`${MESES_ABR[m]}/${String(y).slice(2)}`:`${MESES[m]} de ${y}`;}
function mesIdxDe(y,m){return y*12+(m-1);}
const HOJE=hojeStr(), HOJE_P=pYMD(HOJE), MES_ATUAL=mesIdxDe(HOJE_P.y,HOJE_P.m);

/* =========================== Catálogo base =========================== */
const GRUPOS=[
  {id:'g-rec',nome:'Receitas',tipo:'entrada'},
  {id:'g-fin-e',nome:'Rendimentos e resgates',tipo:'entrada'},
  {id:'g-mor',nome:'Moradia',tipo:'saida'},
  {id:'g-ali',nome:'Alimentação',tipo:'saida'},
  {id:'g-tra',nome:'Transporte',tipo:'saida'},
  {id:'g-vei',nome:'Veículo',tipo:'saida'},
  {id:'g-ser',nome:'Serviços',tipo:'saida'},
  {id:'g-laz',nome:'Lazer',tipo:'saida'},
  {id:'g-sau',nome:'Saúde',tipo:'saida'},
  {id:'g-fin-s',nome:'Aportes e taxas',tipo:'saida'},
  {id:'g-out',nome:'Outros',tipo:'saida'}
].map((g,i)=>({...g,ativo:true,ordem:i}));

const CATEGORIAS=[
  ['c-sal','g-rec','Salário'],['c-fre','g-rec','Freelance'],['c-13','g-rec','Décimo terceiro'],['c-reem','g-rec','Reembolso'],
  ['c-rend','g-fin-e','Rendimento de conta','rendimento'],['c-div','g-fin-e','Dividendos','rendimento'],
  ['c-jur','g-fin-e','Juros de aplicação','rendimento'],['c-resg','g-fin-e','Resgate','resgate'],
  ['c-alu','g-mor','Aluguel'],['c-cond','g-mor','Condomínio'],['c-ene','g-mor','Energia'],['c-agu','g-mor','Água'],['c-int','g-mor','Internet'],
  ['c-mer','g-ali','Mercado'],['c-res','g-ali','Restaurante'],['c-del','g-ali','Delivery'],['c-pad','g-ali','Padaria'],
  ['c-app','g-tra','Aplicativo de transporte'],['c-est','g-tra','Estacionamento'],['c-ped','g-tra','Pedágio'],['c-pas','g-tra','Passagem'],
  ['c-comb','g-vei','Combustível',null,true],['c-man','g-vei','Manutenção',null,true],['c-oleo','g-vei','Troca de óleo',null,true],
  ['c-pec','g-vei','Peças',null,true],['c-ace','g-vei','Acessórios',null,true],['c-seg','g-vei','Seguro',null,true],
  ['c-ipva','g-vei','IPVA',null,true],['c-lic','g-vei','Licenciamento',null,true],['c-servei','g-vei','Serviços veiculares',null,true],
  ['c-aqu','g-vei','Aquisição de veículo',null,true],['c-outv','g-vei','Outros custos do veículo',null,true],
  ['c-ass','g-ser','Assinaturas'],['c-tel','g-ser','Telefonia'],['c-dom','g-ser','Serviços domésticos'],
  ['c-cin','g-laz','Cinema'],['c-via','g-laz','Viagem'],['c-bar','g-laz','Bares'],['c-str','g-laz','Streaming'],
  ['c-pla','g-sau','Plano de saúde'],['c-far','g-sau','Farmácia'],['c-con','g-sau','Consultas'],['c-aca','g-sau','Academia'],
  ['c-apo','g-fin-s','Aporte','aporte'],['c-tax','g-fin-s','Taxas e tarifas','taxa'],
  ['c-pres','g-out','Presentes'],['c-edu','g-out','Educação'],['c-outros','g-out','Outros']
].map((c,i)=>({id:c[0],grupoId:c[1],nome:c[2],fin:c[3]||null,veicular:!!c[4],ativo:true,ordem:i}));

const FORMAS=['Pix','Espécie','Transferência','Cartão de crédito'];

/* =========================== Perfis da casa =========================== */
/* Dois perfis fixos. O papel (administrador ou não) vem daqui e nunca dos
   dados salvos, para que ninguém se promova editando o próprio perfil. */
const PERFIS_CASA=[
  {id:'henrique',nome:'Henrique',iniciais:'HE',papel:'Administrador',admin:true,pron:'ele'},
  {id:'eyshila',nome:'Eyshila',iniciais:'EY',papel:'Usuária',admin:false,pron:'ela'}
];
/* O modo casal só soma lançamentos com data de parcela a partir daqui. */
const INICIO_CASAL='2026-09-01', MES_INICIO_CASAL='2026-09';
const perfilCasa=id=>PERFIS_CASA.find(p=>p.id===id)||null;
const parceiroDe=id=>(PERFIS_CASA.find(p=>p.id!==id)||{}).id||null;
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function novoPerfil(id){
  const p=perfilCasa(id);
  return {
    grupos:clone(GRUPOS),categorias:clone(CATEGORIAS),formas:[...FORMAS],
    instituicoes:[],veiculos:[],cartoes:[],
    lancamentos:[],recorrencias:[],
    emprestimos:{pessoas:[],contratos:[]},
    capital:{contas:[]},
    perfil:{nome:p.nome,email:'',iniciais:p.iniciais,papel:p.papel},
    prefs:{tema:'auto',alertasPercentual:20,alertasResultado:true,modoCasal:false},
    notifLidas:false
  };
}
function catGrupo(catId){const c=CATEGORIAS.find(x=>x.id===catId);return c?c.grupoId:'g-out';}
</script>
<script>
/* =========================================================================
   Bloco 2: estado, armazenamento local, cálculos e infraestrutura de UI
   ========================================================================= */
/* ---------------------------------------------------------------------------
   Armazenamento (versão hospedada fora do Claude, com Supabase)
   - docs_privados: o histórico completo de cada pessoa, Empréstimos e
     Capital. As regras de acesso do banco (RLS) só entregam as linhas da
     própria conta, qualquer que seja a forma de consulta.
   - docs_casal: catálogo, AGREGADOS mensais (completos a partir de set/2026;
     antes disso, só a parte marcada como Casal) e custo mensal por veículo,
     sem registro individual. Os dois leem; cada um grava só o próprio.
   Os caminhos internos continuam no formato antigo (data/users/<conta>/...,
   casal/<perfil>/...) e o adaptador criarDbSupabase os traduz.
   --------------------------------------------------------------------------- */
const CHAVE_LOCAL='meufluxo.casa.v1', CHAVE_SESSAO='meufluxo.casa.sessao';
const DIAS_SESSAO=30;
let DB={usuarioAtual:null,dados:{}};
let PAGINA='visao-geral';
let VER=0;

/* JSON canônico (chaves ordenadas): para saber se um documento mudou */
function estavel(v){
  if(Array.isArray(v))return '['+v.map(x=>estavel(x===undefined?null:x)).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+estavel(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
const esperar=ms=>new Promise(r=>setTimeout(r,ms));

const ARM={
  modo:'carregando',db:null,uid:null,mem:null,
  _lerLocal(){if(this.mem)return this.mem;try{this.mem=JSON.parse(localStorage.getItem(CHAVE_LOCAL)||'{}')||{};}catch(e){this.mem={};}return this.mem;},
  _gravarLocal(){try{localStorage.setItem(CHAVE_LOCAL,JSON.stringify(this.mem||{}));}catch(e){throw {code:'quota_exceeded',message:'Sem espaço no armazenamento do navegador.'};}},
  async get(path){
    if(this.modo==='nuvem'){
      for(let t=0;t<2;t++){try{const s=await this.db.doc(path).get();return s.exists?clone(s.data()):null;}
        catch(e){if(e&&e.code==='unavailable'&&t===0){await esperar(400+Math.random()*600);continue;}throw e;}}
    }
    const m=this._lerLocal();return m[path]?clone(m[path]):null;
  },
  async set(path,obj){
    if(this.modo==='nuvem'){
      for(let t=0;t<2;t++){try{await this.db.doc(path).set(obj);return;}
        catch(e){if(e&&e.code==='unavailable'&&t===0){await esperar(400+Math.random()*600);continue;}throw e;}}
    }
    const m=this._lerLocal();m[path]=clone(obj);this._gravarLocal();
  },
  async del(path){
    if(this.modo==='nuvem'){await this.db.doc(path).delete();return;}
    const m=this._lerLocal();delete m[path];this._gravarLocal();
  },
  async list(col){
    if(this.modo==='nuvem'){const q=await this.db.collection(col).limit(1000).get();return q.docs.map(d=>({id:d.id,data:clone(d.data())}));}

    return Object.keys(m).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>({id:k.slice(pre.length),data:clone(m[k])}));
  }
};

function assinar(r,recarregar){
  let t=null;const disparar=()=>{clearTimeout(t);t=setTimeout(recarregar,250);};
  let canal=null;

      .on('postgres_changes',{event:'*',schema:'public',table:'docs_casal',filter:'perfil=eq.'+r.v},disparar)

/* Adaptador com a MESMA interface que o app já usava (doc/collection,
   get/set/delete, onSnapshot, docChanges), agora sobre o Supabase. */
function criarDbSupabase(sb){
  async function lerDoc(r){
    const {data,error}=await sb.from(r.t).select('dados').eq(r.k,r.v).eq('caminho',r.c).maybeSingle();
    if(error)throw erroSupabase(error);
    return data?data.dados:null;
  }
  async function lerColecao(r,n){
    let q=sb.from(r.t).select('caminho,dados').eq(r.k,r.v);
    if(r.pre){q=q.like('caminho',escLike(r.pre)+'/%').not('caminho','like',escLike(r.pre)+'/%/%');}
    else{q=q.not('caminho','like','%/%');}
    const {data,error}=await q.limit(n||1000);
    if(error)throw erroSupabase(error);
    const corte=r.pre?r.pre.length+1:0;
    return (data||[]).map(x=>({id:x.caminho.slice(corte),dados:x.dados})).filter(x=>x.id&&x.id!=='_');
  }
  return {
    doc(path){
      const r=rotaDoc(path);
      return {
        async get(){try{return docSnap(r.c,await lerDoc(r));}catch(e){throw e&&e.code?e:erroSupabase(e);}},
        async set(obj){
          const linha={[r.k]:r.v,caminho:r.c,dados:obj};
          if(r.t==='docs_casal')linha.user_id=ARM.uid;
          try{const {error}=await sb.from(r.t).upsert(linha,{onConflict:r.t==='docs_privados'?'user_id,caminho':'perfil,caminho'});
            if(error)throw erroSupabase(error);}catch(e){throw e&&e.code?e:erroSupabase(e);}
        },
        async delete(){
          try{const {error}=await sb.from(r.t).delete().eq(r.k,r.v).eq('caminho',r.c);if(error)throw erroSupabase(error);}
          catch(e){throw e&&e.code?e:erroSupabase(e);}
        },
        onSnapshot(cb,erro){
          let ultimo;
          const recarregar=async()=>{try{const d=await lerDoc(r);const k=estavel(d);if(k===ultimo)return;ultimo=k;cb(docSnap(r.c,d));}
            catch(e){if(erro)erro(e);}};
          recarregar();
          return assinar(r,recarregar);
        }
      };
    },
    collection(col){
      const r=rotaColecao(col);let lim=1000;
      const api={
        limit(n){lim=n;return api;},
        async get(){const l=await lerColecao(r,lim);return {docs:l.map(x=>docSnap(x.id,x.dados))};},
        onSnapshot(cb,erro){
          let antes=new Map();
          const recarregar=async()=>{
            try{
              const l=await lerColecao(r,lim);const agora=new Map(l.map(x=>[x.id,estavel(x.dados)]));
              const mudancas=[];
              l.forEach(x=>{const a=antes.get(x.id);if(a===undefined)mudancas.push({type:'added',doc:docSnap(x.id,x.dados)});
                else if(a!==agora.get(x.id))mudancas.push({type:'modified',doc:docSnap(x.id,x.dados)});});
              antes.forEach((v,id)=>{if(!agora.has(id))mudancas.push({type:'removed',doc:docSnap(id,null)});});
              const primeira=antes.size===0&&!recarregar.feito;recarregar.feito=true;
              antes=agora;
              if(!mudancas.length&&!primeira)return;
              cb({docs:l.map(x=>docSnap(x.id,x.dados)),docChanges:()=>mudancas});
            }catch(e){if(erro)erro(e);}
          };
          recarregar();
          return assinar(r,recarregar);
        }
      };
      return api;
    }
  };
}

let ULTIMO={};           // caminho -> JSON canônico do que está salvo
function docsDoPerfil(id,d){
  const P=caminhoPerfil(id),out={};
  out[P]={v:1,grupos:d.grupos,categorias:d.categorias,formas:d.formas,instituicoes:d.instituicoes,veiculos:d.veiculos,
    cartoes:d.cartoes,recorrencias:d.recorrencias,perfil:d.perfil,prefs:d.prefs,
    notifLidas:Array.isArray(d.notifLidas)?d.notifLidas.slice(-60):!!d.notifLidas};

  out[P+'/mod/capital']=d.capital;
  const porMes={};
  d.lancamentos.forEach(l=>{const m=String(l.dataParcela||'0000-00').slice(0,7);(porMes[m]=porMes[m]||[]).push(l);});
  Object.keys(porMes).forEach(m=>{
    const itens=porMes[m].slice().sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    out[P+'/lanc/'+m]={itens};
    /* Regra do modo casal (v11):
       - a partir de set/2026: totais completos do mês (entram no consolidado);
       - antes de set/2026: SÓ a parte marcada como do casal (entra apenas na
         Análise do casal). Meses antigos sem nada marcado não são publicados. */
    if(m>=MES_INICIO_CASAL)out['casal/'+id+'/agg/'+m]=agregarMes(itens);
    else{const a=agregarMes(itens,{soCasal:true});if(a.buckets.length)out['casal/'+id+'/agg/'+m]=a;}
  });
  out['casal/'+id]={nome:d.perfil.nome,catalogo:{grupos:d.grupos,categorias:d.categorias}};
  out['casal/'+id+'/veiculos']=agregarVeiculos(d);
  // meses que ficaram vazios continuam existindo, agora zerados
  Object.keys(ULTIMO).forEach(p=>{
    if(p in out)return;
    if(p.startsWith(P+'/lanc/'))out[p]={itens:[]};
    if(p.startsWith('casal/'+id+'/agg/'))out[p]={v:3,buckets:[]};
  });
  return out;
}
/* Veículos no contexto do casal: a lista de veículos (nome e tipo, sem placa)
   e, por mês, o custo de cada um. Só entram lançamentos que JÁ estão
   vinculados a um veículo; nada é atribuído por suposição. */
function agregarVeiculos(d){
  const meses={};
  d.lancamentos.forEach(l=>{
    if(!l.veiculoId||l.tipo!=='saida'||situacao(l)==='cancelado')return;
    if(!d.veiculos.some(v=>v.id===l.veiculoId))return;
    const m=String(l.dataParcela||'').slice(0,7);if(!m)return;
    const mv=(meses[m]=meses[m]||{});
    const r=(mv[l.veiculoId]=mv[l.veiculoId]||{total:0,operacional:0,qtd:0,futuro:0,cats:{}});
    const v=+l.valor||0;
    r.total=round2(r.total+v);r.qtd++;
    if(l.incluiCustoVeiculo!==false)r.operacional=round2(r.operacional+v);
    if(situacao(l)==='futuro')r.futuro=round2(r.futuro+v);
    r.cats[l.categoriaId||'']=round2((r.cats[l.categoriaId||'']||0)+v);
  });
  return {v:1,veiculos:d.veiculos.map(v=>({id:v.id,nome:v.nome,tipo:v.tipo||''})),meses};
}
/* ---------------------------------------------------------------------------
   Agregado mensal publicado no caminho COMPARTILHADO casal/<perfil>/agg/<mês>.
   É o único dado que a outra pessoa enxerga, e por isso não carrega registro
   individual: nada de observação, data exata, forma de pagamento, parcela,
   instituição, veículo ou identificador de lançamento. Sai apenas a soma por
   (tipo, grupo, categoria) do mês, com a parte marcada como do casal e a
   contagem de registros que formaram cada soma.
   --------------------------------------------------------------------------- */
function agregarMes(itens,{soCasal=false}={}){
  const mapa=new Map();
  itens.forEach(l=>{
    if(situacao(l)==='cancelado')return;
    if(!l.dataParcela)return;
    if(soCasal&&!(l.casal&&l.tipo==='saida'))return;
    const k=l.tipo+'|'+(l.grupoId||'g-out')+'|'+(l.categoriaId||'');
    let b=mapa.get(k);
    if(!b){b={tipo:l.tipo,grupoId:l.grupoId||'g-out',categoriaId:l.categoriaId||'',total:0,casal:0,qtd:0,qtdCasal:0,futuro:0};mapa.set(k,b);}
    b.total=round2(b.total+(+l.valor||0));
    b.qtd++;
    if(situacao(l)==='futuro')b.futuro=round2(b.futuro+(+l.valor||0));
    if(l.casal){b.casal=round2(b.casal+(+l.valor||0));b.qtdCasal++;}
  });
  let buckets=[...mapa.values()].sort((a,b)=>a.tipo<b.tipo?-1:a.tipo>b.tipo?1:(b.total-a.total));
  // antes de set/2026 sai só a parte do casal: sem total geral nem contagem geral do mês
  if(soCasal)buckets=buckets.map(b=>({tipo:b.tipo,grupoId:b.grupoId,categoriaId:b.categoriaId,casal:b.casal,qtdCasal:b.qtdCasal}));
  return soCasal?{v:3,escopo:'casal',buckets}:{v:3,buckets};
}
function aplicarBase(d,base){
  ['grupos','categorias','formas','instituicoes','veiculos','cartoes','recorrencias','prefs','notifLidas'].forEach(k=>{if(base[k]!==undefined)d[k]=base[k];});
  if(base.perfil)d.perfil={...d.perfil,...base.perfil};
}
async function carregarPerfil(id){
  const P=caminhoPerfil(id);
  const d=novoPerfil(id);
  /* Lançamentos, Empréstimos e Capital são lidos SEMPRE, mesmo que o
     documento-base do perfil falte: dado que existe no banco nunca fica
     escondido nem é sobrescrito por um perfil vazio. */
  const [base,emp,cap,meses]=await Promise.all([ARM.get(P),ARM.get(P+'/mod/emprestimos'),ARM.get(P+'/mod/capital'),ARM.list(P+'/lanc')]);
  if(base){aplicarBase(d,base);ULTIMO[P]=estavel(base);}
  if(emp){d.emprestimos=emp;ULTIMO[P+'/mod/emprestimos']=estavel(emp);}
  if(cap){d.capital=cap;ULTIMO[P+'/mod/capital']=estavel(cap);}
  d.lancamentos=[];
  meses.sort((a,b)=>a.id<b.id?1:-1).forEach(m=>{const it=(m.data&&m.data.itens)||[];ULTIMO[P+'/lanc/'+m.id]=estavel({itens:it});d.lancamentos.push(...it);});
  d.lancamentos.sort((a,b)=>a.dataParcela<b.dataParcela?1:-1);
  const pub=await ARM.get('casal/'+id);if(pub)ULTIMO['casal/'+id]=estavel(pub);
  /* Os totais já publicados entram no controle de alterações: se um mês deixar
     de ter dados (lançamento excluído, data mudada, marcação retirada), o
     total publicado é zerado em vez de ficar desatualizado para o parceiro. */
  try{(await ARM.list('casal/'+id+'/agg')).forEach(m=>{ULTIMO['casal/'+id+'/agg/'+m.id]=estavel(m.data);});}catch(e){}
  const pc=perfilCasa(id);d.perfil.papel=pc.papel;
  if(!d.prefs)d.prefs={};if(d.prefs.modoCasal===undefined)d.prefs.modoCasal=false;
  return {d,novo:!base&&!meses.length&&!emp&&!cap};
}

/* ---- dados do parceiro (modo casal) ---- */
let PARCEIRO={id:null,nome:'',catalogo:null,meses:{},lista:[],veic:null};
/* Cada bucket do agregado do parceiro vira UMA entrada sintética, datada no
   dia 1º do mês. Serve para somar em KPIs, evolução, grupos e categorias sem
   que exista qualquer registro individual dele(a) neste aparelho. */
/* Cada bucket do agregado do parceiro vira entrada sintética (nunca vira linha).
   - Mês passado: tudo realizado. Mês futuro: tudo previsto. Mês corrente: a
     parte prevista vai para o último dia do mês, para os KPIs de "realizado"
     não contarem como paga uma conta que ainda vai vencer.
   - Agregado "só casal" (antes de set/2026) gera entradas _soCasal, que ficam
     FORA do consolidado e entram apenas na Análise do casal. */
function entradasDoAgregado(mes,agg,dono){
  const d1=mes+'-01',ult=mes+'-'+pad(new Date(Date.UTC(+mes.slice(0,4),+mes.slice(5,7),0)).getUTCDate());
  const soCasal=!!(agg&&agg.escopo==='casal');
  const mesIdx=mesIndex(d1);
  const out=[];
  (agg&&agg.buckets||[]).forEach((b,i)=>{
    const base={_dono:dono,_agregado:true,_soCasal:soCasal,grupoId:b.grupoId,categoriaId:b.categoriaId,tipo:b.tipo,
      observacao:'',formaPagamento:'—',situacaoManual:null};
    if(soCasal){
      out.push({...base,id:'agg:'+dono+':'+mes+':'+i,valor:b.casal||0,casalValor:b.casal||0,casal:true,
        _qtd:b.qtdCasal|0,_qtdCasal:b.qtdCasal|0,dataParcela:d1,dataOriginal:d1});
      return;
    }
    const total=+b.total||0,fut=mesIdx>MES_ATUAL?total:(mesIdx<MES_ATUAL?0:Math.min(+b.futuro||0,total));
    const real=round2(total-fut);
    if(real>0||fut===0)out.push({...base,id:'agg:'+dono+':'+mes+':'+i,valor:real,casalValor:b.casal||0,casal:(b.casal||0)>0,
      _qtd:b.qtd|0,_qtdCasal:b.qtdCasal|0,dataParcela:mesIdx>MES_ATUAL?ult:d1,dataOriginal:d1});
    if(fut>0)out.push({...base,id:'agg:'+dono+':'+mes+':'+i+':f',valor:round2(fut),casalValor:real>0?0:(b.casal||0),casal:real>0?false:(b.casal||0)>0,
      _qtd:0,_qtdCasal:real>0?0:(b.qtdCasal|0),dataParcela:ult,dataOriginal:d1});
  });
  return out;
}
function recalcParceiro(){
  const id=PARCEIRO.id;
  PARCEIRO.lista=Object.keys(PARCEIRO.meses).sort()
    .flatMap(m=>entradasDoAgregado(m,PARCEIRO.meses[m],id));
  VER++;
}
/* Migração da v9: até aqui o app publicava os lançamentos INTEIROS em
   casal/<perfil>/lanc/<mês>, legíveis pela conta do parceiro. Esses
   documentos são apagados no primeiro acesso de cada perfil; o histórico
   real não é tocado, porque ele vive em data/users/<conta>/p-<perfil>/lanc. */
async function limparCompartilhadoAntigo(id){

    if(antigos.length)console.info('Removidos '+antigos.length+' documento(s) compartilhado(s) da versão anterior.');
  }catch(e){console.warn('Não foi possível limpar o compartilhamento antigo.',e);}
}
async function carregarParceiro(id){

  try{

}

   a partir de 01/09/2026 (antes, só o histórico de quem estava conectado
   entrava, o que misturava períodos). As despesas marcadas como Casal usam
   todo o histórico, mas apenas na Análise do casal (baseCasal). */

let OUVINTES=[],RENDER_ADIADO=false,T_RENDER=null;
function pararOuvintes(){OUVINTES.forEach(u=>{try{u();}catch(e){}});OUVINTES=[];}
function reRenderRemoto(){

function ouvir(){
  pararOuvintes();
  if(ARM.modo!=='nuvem')return;
  const id=DB.usuarioAtual,par=PARCEIRO.id,P=caminhoPerfil(id),db=ARM.db;
  const erro=e=>console.warn('Sincronização interrompida',e);
  try{
    OUVINTES.push(db.doc('casal/'+par).onSnapshot(s=>{
      const d=s.exists?s.data():null;PARCEIRO.catalogo=d&&d.catalogo?clone(d.catalogo):null;
      if(d&&d.nome)PARCEIRO.nome=d.nome;VER++;if(modoCasal())reRenderRemoto();},erro));
    OUVINTES.push(db.doc('casal/'+par+'/veiculos').onSnapshot(s=>{
      PARCEIRO.veic=s.exists?clone(s.data()):null;VER++;if(modoCasal())reRenderRemoto();},erro));
    OUVINTES.push(db.collection('casal/'+par+'/agg').limit(1000).onSnapshot(q=>{
      PARCEIRO.meses={};q.docs.forEach(d=>{PARCEIRO.meses[d.id]=clone(d.data()||null);});
      recalcParceiro();if(modoCasal())reRenderRemoto();},erro));
    // alterações feitas por este mesmo perfil em outro aparelho
    OUVINTES.push(db.collection(P+'/lanc').limit(1000).onSnapshot(q=>{
      if(PENDENTE)return;let mudou=false;
      q.docChanges().forEach(ch=>{
        if(ch.doc.metadata&&ch.doc.metadata.hasPendingWrites)return;
        const p=P+'/lanc/'+ch.doc.id,dados={itens:ch.type==='removed'?[]:clone((ch.doc.data()||{}).itens||[])},s=estavel(dados);
        if(ULTIMO[p]===s)return;
        const d=D();if(!d)return;
        d.lancamentos=d.lancamentos.filter(l=>String(l.dataParcela||'').slice(0,7)!==ch.doc.id).concat(dados.itens);
        d.lancamentos.sort((a,b)=>a.dataParcela<b.dataParcela?1:-1);
        ULTIMO[p]=s;mudou=true;});
      if(mudou){VER++;reRenderRemoto();}},erro));
    OUVINTES.push(db.doc(P).onSnapshot(s=>{
      if(PENDENTE||!s.exists||(s.metadata&&s.metadata.hasPendingWrites))return;
      const b=s.data(),st=estavel(b);if(ULTIMO[P]===st)return;
      const d=D();if(!d)return;aplicarBase(d,clone(b));d.perfil.papel=perfilCasa(id).papel;ULTIMO[P]=st;VER++;reRenderRemoto();},erro));
    ['emprestimos','capital'].forEach(k=>{
      OUVINTES.push(db.doc(P+'/mod/'+k).onSnapshot(s=>{
        if(PENDENTE||!s.exists||(s.metadata&&s.metadata.hasPendingWrites))return;
        const b=s.data(),st=estavel(b),p=P+'/mod/'+k;if(ULTIMO[p]===st)return;
        const d=D();if(!d)return;d[k]=clone(b);ULTIMO[p]=st;VER++;reRenderRemoto();},erro));
    });
  }catch(e){console.warn('Não foi possível abrir a sincronização em tempo real.',e);}
}

/* ---- situação derivada (reconhecimento automático pela data) ---- */
function situacao(l){
  if(l.situacaoManual==='cancelado')return 'cancelado';
  if(l.situacaoManual==='realizado')return 'realizado';
  if(l.situacaoManual==='futuro'&&l.dataParcela>HOJE)return 'futuro';
  return l.dataParcela<=HOJE?'realizado':'futuro';
}
const ehRealizado=l=>situacao(l)==='realizado';
const tagSituacao=l=>{const s=situacao(l);
  return s==='realizado'?'<span class="tag ok">✓ Realizado</span>':s==='futuro'?'<span class="tag fut">◷ Futuro</span>':'<span class="tag can">✕ Cancelado</span>';};
const sinal=l=>l.tipo==='entrada'?'+':'−';
const valorAssinado=l=>(l.tipo==='entrada'?1:-1)*l.valor;
const classeTipo=l=>l.tipo==='entrada'?'pos':'neg';

/* ---- estado de filtros da Visão geral ---- */
const F={ano:String(HOJE_P.y),mes:String(HOJE_P.m),aberto:false,aplicarKpi:false,
  adv:{deMes:'',deAno:'',ateMes:'',ateAno:'',tipo:'',grupo:'',categoria:'',forma:'',inst:'',veiculo:'',situacao:'',busca:''}};
function advAtivos(){const a=F.adv;const out=[];
  if(a.deMes&&a.deAno)out.push(['periodo','De '+MESES[+a.deMes-1]+'/'+a.deAno+(a.ateMes&&a.ateAno?' até '+MESES[+a.ateMes-1]+'/'+a.ateAno:'')]);
  else if(a.ateMes&&a.ateAno)out.push(['periodo','Até '+MESES[+a.ateMes-1]+'/'+a.ateAno]);
  if(a.tipo)out.push(['tipo',a.tipo==='entrada'?'Entradas':'Saídas']);
  if(a.grupo)out.push(['grupo','Grupo: '+nomeGrupo(a.grupo)]);
  if(a.categoria)out.push(['categoria','Categoria: '+nomeCat(a.categoria)]);
  if(a.forma)out.push(['forma','Pagamento: '+a.forma]);
  if(a.inst)out.push(['inst','Instituição: '+nomeInst(a.inst)]);
  if(a.veiculo)out.push(['veiculo','Veículo: '+nomeVeic(a.veiculo)]);
  if(a.situacao)out.push(['situacao','Situação: '+a.situacao]);
  if(a.busca)out.push(['busca','Observação: “'+a.busca+'”']);
  return out;
}
function intervaloBase(){ // mês/ano principais
  if(F.ano==='*'){const anos=LV().map(l=>pYMD(l.dataParcela).y);
    return {ini:mesIdxDe(Math.min(...anos),1),fim:mesIdxDe(Math.max(...anos),12)};}
  const y=+F.ano;
  if(F.mes==='*')return {ini:mesIdxDe(y,1),fim:mesIdxDe(y,12)};
  return {ini:mesIdxDe(y,+F.mes),fim:mesIdxDe(y,+F.mes)};
}
function intervaloEfetivo(){ // com filtros avançados de período
  let {ini,fim}=intervaloBase();const a=F.adv;
  if(a.deMes&&a.deAno)ini=Math.max(ini,mesIdxDe(+a.deAno,+a.deMes));
  if(a.ateMes&&a.ateAno)fim=Math.min(fim,mesIdxDe(+a.ateAno,+a.ateMes));
  if(fim<ini)fim=ini;
  return {ini,fim};
}
function filtrarLista(lista,{intervalo=null,adv=null,incluirCancelados=false}={}){
  const a=adv||{};
  return lista.filter(l=>{
    const s=situacao(l);
    if(!incluirCancelados&&s==='cancelado'&&a.situacao!=='cancelado')return false;
    if(intervalo){const mi=mesIndex(l.dataParcela);if(mi<intervalo.ini||mi>intervalo.fim)return false;}
    if(a.tipo&&l.tipo!==a.tipo)return false;
    if(a.grupo&&l.grupoId!==a.grupo)return false;
    if(a.categoria&&l.categoriaId!==a.categoria)return false;
    if(a.forma&&l.formaPagamento!==a.forma)return false;
    if(a.inst&&l.instituicaoId!==a.inst)return false;
    if(a.veiculo&&l.veiculoId!==a.veiculo)return false;
    if(a.situacao&&s!==a.situacao)return false;
    if(a.busca&&!(l.observacao||'').toLowerCase().includes(a.busca.toLowerCase()))return false;
    return true;
  });
}
const escopoGraficos=()=>filtrarLista(LV(),{intervalo:intervaloEfetivo(),adv:F.adv});
const escopoKpis=()=>F.aplicarKpi?escopoGraficos():filtrarLista(LV(),{intervalo:intervaloBase()});

/* ---- cálculos ---- */
function totais(lista){
  const r=lista.filter(ehRealizado);
  const entradas=somaV(r.filter(l=>l.tipo==='entrada'));
  const saidas=somaV(r.filter(l=>l.tipo==='saida'));
  const fut=lista.filter(l=>situacao(l)==='futuro');
  return {entradas,saidas,resultado:round2(entradas-saidas),
    entradasFuturas:somaV(fut.filter(l=>l.tipo==='entrada')),saidasFuturas:somaV(fut.filter(l=>l.tipo==='saida')),
    qtd:lista.filter(l=>situacao(l)!=='cancelado').length,
    qtdCancelados:lista.filter(l=>situacao(l)==='cancelado').length};
}
function acumuladoAte(idxFim,adv=null){
  const lista=filtrarLista(LV(),{adv:adv||{}}).filter(l=>ehRealizado(l)&&mesIndex(l.dataParcela)<=idxFim);
  return round2(somaV(lista.filter(l=>l.tipo==='entrada'))-somaV(lista.filter(l=>l.tipo==='saida')));
}
function serieMensal(ini,fim,adv=null){
  const lista=filtrarLista(LV(),{adv:adv||{}});
  const out=[];let acum=acumuladoAte(ini-1,adv);
  for(let i=ini;i<=fim;i++){
    const doMes=lista.filter(l=>mesIndex(l.dataParcela)===i);
    const t=totais(doMes);acum=round2(acum+t.resultado);
    out.push({idx:i,label:mesLabel(i),entradas:t.entradas,saidas:t.saidas,resultado:t.resultado,acumulado:acum,
      futuroE:t.entradasFuturas,futuroS:t.saidasFuturas});
  }
  return out;
}
function porCategoria(lista,tipo){
  const m=new Map();
  lista.filter(l=>l.tipo===tipo&&ehRealizado(l)).forEach(l=>{
    const k=l.categoriaId;m.set(k,(m.get(k)||0)+cents(l.valor));});
  const arr=[...m].map(([k,v])=>({id:k,nome:nomeCat(k),grupo:nomeGrupo(cat(k)?.grupoId),valor:v/100}));
  arr.sort((a,b)=>b.valor-a.valor);const tot=arr.reduce((a,b)=>a+b.valor,0);
  arr.forEach(x=>x.pct=tot?round2(x.valor/tot*100):0);
  return {itens:arr,total:round2(tot)};
}
function variacao(atual,anterior){
  if(!isFinite(anterior)||anterior===0)return null;
  return round2((atual-anterior)/Math.abs(anterior)*100);
}

/* ---- parcelas ---- */
function dividirParcelas(total,n){
  const t=cents(total),base=Math.floor(t/n),sobra=t-base*n;
  return Array.from({length:n},(_,i)=>(base+(i<sobra?1:0))/100);
}
function ocorrenciasRecorrencia(dataInicial,frequencia,{ate=null,qtd=null,maxPadrao=24}={}){
  const passo={semanal:0,mensal:1,trimestral:3,semestral:6,anual:12}[frequencia];
  const datas=[];
  if(frequencia==='semanal'){
    let d=new Date(dataInicial+'T12:00:00');let i=0;
    const limite=qtd||(ate?400:maxPadrao*4);
    while(i<limite){const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      if(ate&&s>ate)break;datas.push(s);d.setDate(d.getDate()+7);i++;}
  }else{
    const limite=qtd||(ate?400:maxPadrao);
    for(let i=0;i<limite;i++){const s=addMeses(dataInicial,i*passo);if(ate&&s>ate)break;datas.push(s);}
  }
  return datas;
}

let modalAnterior=null, modalAoFechar=null;
let T_FECHA_MODAL=null;
function abrirModal({titulo,corpo,rodape='',pequeno=false,aoAbrir=null,aoFechar=null,foco=null}){
  // um fechamento ainda em andamento não pode apagar o modal que está abrindo agora
  clearTimeout(T_FECHA_MODAL);
  modalAnterior=document.activeElement;modalAoFechar=aoFechar;
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="modal-card ${pequeno?'sm':''}">
    <div class="modal-head"><h2 id="modalTitle">${esc(titulo)}</h2>
      <button class="icon-btn" data-fechar aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${corpo}</div>${rodape?`<div class="modal-foot">${rodape}</div>`:''}</div>`;
  requestAnimationFrame(()=>{m.classList.add('on');$('#scrim').classList.add('on');});
  document.body.style.overflow='hidden';
  m.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=fecharModal);
  if(aoAbrir)aoAbrir(m);
  const f=(foco&&m.querySelector(foco))||m.querySelector('input,select,textarea,button:not([data-fechar])');if(f)setTimeout(()=>f.focus(),80);
  return m;
}
function fecharModal(){
  const m=$('#modal');if(m.hidden)return;
  const cb=modalAoFechar;modalAoFechar=null;
  m.classList.remove('on');$('#scrim').classList.remove('on');
  document.body.style.overflow='';
  T_FECHA_MODAL=setTimeout(()=>{m.hidden=true;m.innerHTML='';},180);
  if(modalAnterior&&modalAnterior.focus)modalAnterior.focus();
  if(cb)cb();
  setTimeout(renderAdiado,220);
}
function confirmar({titulo,texto,botao='Confirmar',perigo=true}){
  return new Promise(res=>{
    let escolhido=false;
    abrirModal({titulo,pequeno:true,corpo:`<p>${texto}</p>`,
      rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn ${perigo?'btn-danger':'btn-primary'}" id="okConf">${esc(botao)}</button>`,
      aoFechar:()=>{if(!escolhido)res(false);},
      aoAbrir:m=>{m.querySelector('#okConf').onclick=()=>{escolhido=true;fecharModal();res(true);};}});
  });
}

function menuAcoes(btn,itens){
  if(MENU_ABERTO&&MENU_ABERTO.btn===btn){fecharMenuAcoes();return;}
  fecharMenuAcoes();
  const pop=document.createElement('div');
  pop.className='menu-pop';pop.setAttribute('role','menu');
  pop.innerHTML=itens.map((it,i)=>it.sep?'<div class="menu-sep" role="separator"></div>':
    `<button type="button" role="menuitem" class="${it.perigo?'perigo':''}" data-i="${i}">${it.icone||''}<span>${esc(it.texto)}</span></button>`).join('');
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let left=Math.min(r.right-pw,window.innerWidth-pw-8);if(left<8)left=8;
  let top=r.bottom+6;if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-6);
  pop.style.left=left+'px';pop.style.top=top+'px';
  requestAnimationFrame(()=>pop.classList.add('on'));
  btn.setAttribute('aria-expanded','true');
  pop.querySelectorAll('button[data-i]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const it=itens[+b.dataset.i];fecharMenuAcoes();if(it.aoClicar)it.aoClicar();
  });
  const fechar=()=>fecharMenuAcoes();
  MENU_ABERTO={el:pop,btn,fechar};
  /* liga o fechamento por rolagem só depois deste ciclo, pra não fechar por causa
     de um scrollIntoView disparado pelo próprio clique que abriu o menu */
  setTimeout(()=>{
    if(!MENU_ABERTO||MENU_ABERTO.fechar!==fechar)return;
    window.addEventListener('scroll',fechar,true);
    window.addEventListener('resize',fechar);
  },0);
}
document.addEventListener('click',e=>{
  if(!MENU_ABERTO)return;
  if(e.target.closest('.menu-pop')||e.target===MENU_ABERTO.btn||MENU_ABERTO.btn.contains(e.target))return;
  fecharMenuAcoes();
});

const CHARTS={};
/* Paleta categórica — 8 matizes de ordem fixa (nunca ciclar além do 8º; a 9ª
   categoria em diante entra em "Outras", ver COR_OUTRAS), validada com o
   validador de acessibilidade (contraste, separação para daltonismo e piso de
   visão normal) para os fundos claro e escuro do app. Ordem: teal (marca),
   terracota, violeta, jade, ameixa, ouro, azul-petróleo, rosé. */
const PALETA=['#269db6','#b95931','#7968c2','#3f8d41','#a05aa4','#bb7e00','#2e7cc5','#b85271'];
const COR_OUTRAS='#898781';
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function chartDefaults(){
  if(!window.Chart)return;
  Chart.defaults.font.family='"Public Sans", system-ui, sans-serif';
  Chart.defaults.font.size=12;
  Chart.defaults.color=cssVar('--ink-2');
  Chart.defaults.borderColor=cssVar('--border');

function desenharGrafico(idCanvas,cfg,fallback){
  const cv=document.getElementById(idCanvas);if(!cv)return;
  if(!window.Chart){renderFallback(cv,fallback||cfg);return;}
  chartDefaults();
  if(CHARTS[idCanvas]){CHARTS[idCanvas].destroy();delete CHARTS[idCanvas];}
  cfg.options=cfg.options||{};
  cfg.options.responsive=true;cfg.options.maintainAspectRatio=false;
  cfg.options.interaction={mode:'index',intersect:false};
  cfg.options.plugins=Object.assign({legend:{display:false},
    tooltip:{callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${fmt(c.parsed.y!==undefined&&c.parsed.y!==null?c.parsed.y:c.parsed)}`},
      backgroundColor:cssVar('--ink'),titleColor:cssVar('--surface'),bodyColor:cssVar('--surface'),padding:10,cornerRadius:8,displayColors:true}
    },cfg.options.plugins||{});
  try{CHARTS[idCanvas]=new Chart(cv.getContext('2d'),cfg);}
  catch(e){console.warn('Falha ao desenhar gráfico',e);renderFallback(cv,fallback||cfg);}
}
function renderFallback(cv,cfg){
  const box=cv.parentElement;
  const labels=cfg.data?.labels||[],ds=cfg.data?.datasets||[];
  let html='<div class="fb-note">A biblioteca de gráficos não carregou. Abaixo, a mesma informação em formato de barras proporcionais.</div><div class="fb-chart">';
  const maxAbs=Math.max(1,...ds.flatMap(d=>d.data.map(v=>Math.abs(v||0))));
  labels.forEach((lb,i)=>{
    const partes=ds.map((d,j)=>{const v=d.data[i]||0;const cor=Array.isArray(d.backgroundColor)?d.backgroundColor[i%d.backgroundColor.length]:(d.backgroundColor||d.borderColor||PALETA[j%PALETA.length]);
      return `<span style="width:${Math.abs(v)/maxAbs*100/ds.length}%;background:${cor}" title="${esc(d.label||'')}"></span>`;}).join('');
    const vals=ds.map(d=>fmt(d.data[i]||0)).join(' · ');
    html+=`<div class="fb-row"><span>${esc(lb)}</span><span class="fb-bar">${partes}</span><span class="money">${vals}</span></div>`;
  });
  html+='</div>';box.innerHTML=html;
}

function vazio(titulo,texto,acao=''){
  return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l2-4h14l2 4"/><path d="M9 12h6"/></svg>

function esqueleto(n=4){return `<div class="loading-wrap">${Array.from({length:n},()=>'<div class="skeleton sk-line"></div>').join('')}</div>`;}
function sparklineSvg(valores){
  const vals=(valores||[]).map(v=>v==null?0:v);
  if(vals.length<2||vals.every(v=>v===vals[0]))return '';
  const w=100,h=26,pad=2;
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const px=i=>pad+(i/(vals.length-1))*(w-2*pad),py=v=>h-pad-((v-min)/span)*(h-2*pad);
  const pts=vals.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`);
  const showZero=min<0&&max>0;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    ${showZero?`<line x1="0" y1="${py(0).toFixed(1)}" x2="${w}" y2="${py(0).toFixed(1)}" class="spark-zero"/>`:''}
    <polyline points="${pts.join(' ')}" class="spark-line"/>
    <circle cx="${px(vals.length-1).toFixed(1)}" cy="${py(vals[vals.length-1]).toFixed(1)}" r="2" class="spark-dot"/>
  </svg>`;
}
function badgeTrend(pct,inverter=false){
  if(pct===null||pct===undefined)return '<span class="trend">sem base comparável</span>';
  const bom=inverter?pct<0:pct>0;const neutro=Math.abs(pct)<0.5;
  const cls=neutro?'':bom?'up':'down';
  const seta=pct>0?'▲':pct<0?'▼':'■';
  return `<span class="trend ${cls}">${seta} ${fmtPct(pct)}</span>`;
}

/* Liga todos os botões de olho dentro de um contêiner (ou do documento). */

/* ============ v11: filtros recolhíveis no celular ============
   Um único mecanismo para todas as telas: o primeiro cartão de filtros da
   tela ativa ganha, no celular, um botão "Filtros (n)" que o recolhe. O
   estado aberto/fechado é lembrado por tela. No computador nada muda. */
const FILT_ABERTO={};
function contarFiltrosAtivos(card){
  let n=0;
  card.querySelectorAll('select').forEach(sel=>{if(sel.id==='fAno'||sel.id==='fMes')return;
    const o0=sel.options[0];if(!o0)return;
    const padrao=/^(Todos|Todas|Todos os|Todas as)/i.test(o0.textContent.trim())?o0.value:null;
    if(padrao!==null&&sel.value!==padrao)n++;});
  card.querySelectorAll('input[type=search],input[type=text]').forEach(i=>{if(i.value.trim())n++;});
  return n;
}
function compactarFiltros(){
  const sec=document.querySelector('.page.active');if(!sec)return;
  const card=[...sec.querySelectorAll('.card')].find(c=>c.querySelector(':scope > .filterbar'));
  if(!card)return;
  const chave=sec.id+(sec.id==='page-analises'?':'+(ANA&&ANA.aba||''):'');
  card.classList.add('filtros-mob');
  card.classList.toggle('aberto',!!FILT_ABERTO[chave]);
  if(!card.id)card.id='filtros-'+chave.replace(/[^a-z0-9]+/gi,'-');
  let bt=sec.querySelector('.btn-filtros[data-alvo="'+card.id+'"]');
  if(!bt){
    bt=document.createElement('button');bt.type='button';bt.className='btn btn-filtros';bt.dataset.alvo=card.id;
    bt.setAttribute('aria-controls',card.id);
    const quick=sec.querySelector(':scope > .scope-quick');
    if(quick)quick.appendChild(bt);
    else{const barra=document.createElement('div');barra.className='filtros-barra';barra.appendChild(bt);card.parentNode.insertBefore(barra,card);}
    bt.onclick=()=>{FILT_ABERTO[chave]=!FILT_ABERTO[chave];card.classList.toggle('aberto',FILT_ABERTO[chave]);
      bt.setAttribute('aria-expanded',String(!!FILT_ABERTO[chave]));
      if(FILT_ABERTO[chave]){const f=card.querySelector('select,input');if(f)f.focus({preventScroll:true});}};
  }
  const n=contarFiltrosAtivos(card);
  bt.setAttribute('aria-expanded',String(!!FILT_ABERTO[chave]));
  bt.setAttribute('aria-label',n?`Filtros, ${n} ativo(s)`:'Filtros');
  bt.innerHTML=`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros${n?` <span class="n">${n}</span>`:''}`;
}
let T_COMPACTA=null;
function vigiarFiltros(){
  const alvo=$('#content');if(!alvo||vigiarFiltros.ok)return;vigiarFiltros.ok=true;
  new MutationObserver(()=>{clearTimeout(T_COMPACTA);T_COMPACTA=setTimeout(compactarFiltros,30);})
    .observe(alvo,{childList:true,subtree:true});
  document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('.filtros-mob')){clearTimeout(T_COMPACTA);T_COMPACTA=setTimeout(compactarFiltros,30);}});
}

/* Escopo rápido: "Atual" = mês corrente, "Geral" = todo o histórico.
   O estado é derivado dos selects de ano/mês, então o seletor continua
   coerente se o usuário mexer nos filtros normais. */
function escopoRapido(){
  if(F.ano===String(HOJE_P.y)&&F.mes===String(HOJE_P.m))return 'atual';
  if(F.ano==='*'&&F.mes==='*')return 'geral';
  return null;
}
function aplicarEscopoRapido(v){
  if(v==='atual'){F.ano=String(HOJE_P.y);F.mes=String(HOJE_P.m);}
  else{F.ano='*';F.mes='*';}
  atualizarDashboard();
}
function rotuloEscopo(){
  const e=escopoRapido();
  if(e==='atual')return MESES[HOJE_P.m-1]+' de '+HOJE_P.y;
  if(e==='geral')return 'todo o histórico disponível';
  if(F.mes==='*')return F.ano==='*'?'todos os períodos':'ano de '+F.ano;
  return MESES[+F.mes-1]+(F.ano==='*'?' de todos os anos':' de '+F.ano);
}

/* Arraste horizontal sobre o gráfico: mouse no desktop, dedo no celular.
   O toque já rola de forma nativa; aqui tratamos ponteiro fino. */
function ativarArraste(el){
  if(!el)return;
  el.classList.add('grabbable');
  let ativo=false,x0=0,s0=0,moveu=false;
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch')return;
    if(el.scrollWidth<=el.clientWidth+2)return;
    ativo=true;moveu=false;x0=e.clientX;s0=el.scrollLeft;
    el.setPointerCapture(e.pointerId);el.classList.add('grabbing');
  });
  el.addEventListener('pointermove',e=>{
    if(!ativo)return;
    const d=e.clientX-x0;
    if(Math.abs(d)>3)moveu=true;
    el.scrollLeft=s0-d;
  });
  const soltar=e=>{
    if(!ativo)return;
    ativo=false;el.classList.remove('grabbing');
    try{el.releasePointerCapture(e.pointerId);}catch(_){}
  };
  el.addEventListener('pointerup',soltar);
  el.addEventListener('pointercancel',soltar);
  el.addEventListener('click',e=>{if(moveu){e.stopPropagation();e.preventDefault();moveu=false;}},true);
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){el.scrollLeft+=120;e.preventDefault();}
    if(e.key==='ArrowLeft'){el.scrollLeft-=120;e.preventDefault();}
  });
}

/* Coluna de valores fixa à esquerda, desenhada a partir da escala do gráfico. */
function montarEixoFixo(idCanvas,idAxis){
  const col=document.getElementById(idAxis);if(!col)return;
  const ch=CHARTS[idCanvas];
  if(!ch||!ch.scales||!ch.scales.y){
    col.innerHTML='';col.style.display='none';
    const inner=col.parentElement&&col.parentElement.querySelector('.chart-inner');
    if(inner)inner.style.minWidth='0';
    return;
  }
  col.style.display='';
  const y=ch.scales.y, area=ch.chartArea||{top:0,bottom:1e5};
  if(ch.height>0)col.style.height=ch.height+'px';
  col.innerHTML=y.ticks.map(t=>{
    const px=y.getPixelForValue(t.value);
    if(!isFinite(px)||px<area.top-2||px>area.bottom+2)return '';
    return `<span class="axis-tick" style="top:${px}px">${fmtCompacto(t.value)}</span>`;
  }).join('');
}
/* O Chart.js pode reajustar o tamanho logo após criar o gráfico; refazemos a
   escala no quadro seguinte para os rótulos não ficarem defasados. */
function sincronizarEixoFixo(idCanvas,idAxis){
  montarEixoFixo(idCanvas,idAxis);
  requestAnimationFrame(()=>montarEixoFixo(idCanvas,idAxis));
  setTimeout(()=>montarEixoFixo(idCanvas,idAxis),180);
}

function renderEvolucao(iv){

  const series=[
    {k:'entradas',nome:'Entradas',cor:'#2E8B6F'},{k:'saidas',nome:'Saídas',cor:'#B4574B'},
    {k:'resultado',nome:'Resultado',cor:PALETA[0]},{k:'acumulado',nome:'Resultado acumulado',cor:'#7D6BA8'}];
  $('#evoLegend').innerHTML=series.map(s=>`<button data-serie="${s.k}" aria-pressed="${VISTA.evoSeries[s.k]}">

    const teto=Math.max(...serie.map(m=>Math.max(m.entradas,m.saidas)),1);

      ${serie.map(m=>{
        const cls=Math.abs(m.resultado)<0.005?'tl-zero':(m.resultado>0?'tl-pos':'tl-neg');

        const pE=Math.max(m.entradas/teto*100,m.entradas>0?3:0),pS=Math.max(m.saidas/teto*100,m.saidas>0?3:0);
        return `<div class="tl-card ${cls}${hoje}">
        <div class="tl-head"><b>${mesLabel(m.idx,false)}</b>${m.idx===MES_ATUAL?'<span class="tl-flag">Atual</span>':''}</div>
        <div class="tl-res ${cls==='tl-zero'?'':(m.resultado>0?'pos':'neg')}">

        </div>

function pontosAtencao(iv){
  const out=[],lista=filtrarLista(LV(),{adv:F.adv});
  const mesRef=iv.fim,rotulo=mesLabel(mesRef,false);
  const doMes=lista.filter(l=>mesIndex(l.dataParcela)===mesRef);
  const doAnt=lista.filter(l=>mesIndex(l.dataParcela)===mesRef-1);
  const t=totais(doMes),ta=totais(doAnt);
  if(!doMes.filter(ehRealizado).length){
    out.push({nivel:'info',titulo:'Mês ainda sem movimentação realizada.',texto:'As leituras automáticas aparecem quando houver lançamentos realizados no período.',base:'Base: '+rotulo});
    return out;
  }
  if(ta.saidas>0){
    const v=variacao(t.saidas,ta.saidas);
    if(v!==null&&Math.abs(v)>=8) out.push({nivel:v>0?'neg':'pos',titulo:v>0?'Despesas cresceram.':'Despesas recuaram.',
      texto:`As saídas realizadas passaram de ${fmt(ta.saidas)} para ${fmt(t.saidas)} (${fmtPct(v)}).`,
      base:`Comparação: ${rotulo} contra ${mesLabel(mesRef-1,false)}`});
  } else out.push({nivel:'info',titulo:'Sem base de comparação.',texto:'O mês anterior não possui saídas realizadas suficientes para comparar.',base:'Base: '+mesLabel(mesRef-1,false)});
  // maior aumento por categoria
  const a=porCategoria(doMes,'saida'),b=porCategoria(doAnt,'saida');
  let melhor=null;
  a.itens.forEach(i=>{const ant=b.itens.find(x=>x.id===i.id);const dif=i.valor-(ant?ant.valor:0);
    if(ant&&dif>0&&(!melhor||dif>melhor.dif))melhor={nome:i.nome,dif,de:ant.valor,para:i.valor};});
  if(melhor&&melhor.dif>50) out.push({nivel:'warn',titulo:`Maior aumento: ${melhor.nome}.`,
    texto:`Passou de ${fmt(melhor.de)} para ${fmt(melhor.para)}, uma diferença de ${fmt(melhor.dif)}.`,
    base:`Comparação por categoria entre ${mesLabel(mesRef-1)} e ${mesLabel(mesRef)}`});
  if(t.resultado<0) out.push({nivel:'neg',titulo:'Resultado negativo no mês.',
    texto:`As saídas superaram as entradas em ${fmt(Math.abs(t.resultado))}.`,base:'Base: '+rotulo});
  else out.push({nivel:'pos',titulo:'Resultado positivo no mês.',texto:`Sobrou ${fmt(t.resultado)} entre entradas e saídas realizadas.`,base:'Base: '+rotulo});
  if(a.itens.length){
    const top=a.itens[0];
    if(top.pct>=30) out.push({nivel:'warn',titulo:'Concentração de despesas.',
      texto:`${top.nome} representa ${NUM.format(top.pct)}% das saídas realizadas (${fmt(top.valor)}).`,base:'Base: '+rotulo});
  }
  const futuras=lista.filter(l=>situacao(l)==='futuro'&&mesIndex(l.dataParcela)>mesRef&&mesIndex(l.dataParcela)<=mesRef+3&&l.tipo==='saida');
  if(futuras.length){
    const parc=futuras.filter(l=>l.parcelasTotal);
    out.push({nivel:'info',titulo:'Compromissos já agendados.',
      texto:`${futuras.length} saídas futuras somam ${fmt(somaV(futuras))}${parc.length?`, sendo ${parc.length} parcelas de compras a prazo`:''}.`,
      base:`Janela: próximos 3 meses a partir de ${mesLabel(mesRef)}`});
  }
  const s=serieMensal(mesRef-2,mesRef,F.adv);
  if(s.length===3&&s.every(m=>m.entradas+m.saidas>0)){
    const dir=s[2].resultado-s[0].resultado;
    if(Math.abs(dir)>200) out.push({nivel:dir>0?'pos':'warn',titulo:dir>0?'Tendência de melhora.':'Tendência de queda.',
      texto:`O resultado mensal saiu de ${fmt(s[0].resultado)} para ${fmt(s[2].resultado)} nos últimos três meses.`,
      base:`Base: ${s[0].label} a ${s[2].label} · tendência simples, sem ajuste sazonal`});
  }
  return out;
}

function lancamentosFiltrados(){
  let l=[...LV()];
  if(LF.tipo)l=l.filter(x=>x.tipo===LF.tipo);
  if(LF.grupo)l=l.filter(x=>x.grupoId===LF.grupo);

  if(LF.forma)l=l.filter(x=>x.formaPagamento===LF.forma);
  if(LF.inst)l=l.filter(x=>x.instituicaoId===LF.inst);
  if(LF.veiculo)l=l.filter(x=>x.veiculoId===LF.veiculo);
  if(LF.situacao)l=l.filter(x=>situacao(x)===LF.situacao);
  if(LF.busca)l=l.filter(x=>(x.observacao||'').toLowerCase().includes(LF.busca.toLowerCase()));
  if(LF.deMes&&LF.deAno)l=l.filter(x=>mesIndex(x.dataParcela)>=mesIdxDe(+LF.deAno,+LF.deMes));
  if(LF.ateMes&&LF.ateAno)l=l.filter(x=>mesIndex(x.dataParcela)<=mesIdxDe(+LF.ateAno,+LF.ateMes));
  const k=LF.ord;
  l.sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(k==='grupoId'){va=nomeGrupo(a.grupoId);vb=nomeGrupo(b.grupoId);}
    if(k==='categoriaId'){va=nomeCat(a.categoriaId);vb=nomeCat(b.categoriaId);}
    if(k==='situacao'){va=situacao(a);vb=situacao(b);}
    if(va===vb)return 0;return (va>vb?1:-1)*LF.dir;
  });
  return l;
}
/* Marcar/desmarcar "do casal" direto na base. Só o dono do lançamento pode:

function alternarMarcaCasal(id){
  const l=D().lancamentos.find(x=>x.id===id);

  l.casal=!l.casal;

}

        ${cabecalhos.map(([k,t])=>`<th class="${k?'sortable':''} ${t==='Valor'?'r':''}" ${k?`data-ord="${k}"`:''}>${t}${LF.ord===k?(LF.dir===1?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>

/* ---------- exportação de lançamentos ---------- */
function resumoFiltrosLancamentos(){
  const partes=[];
  if(LF.busca)partes.push('busca: "'+LF.busca+'"');
  if(LF.tipo)partes.push('tipo: '+(LF.tipo==='entrada'?'entrada':'saída'));
  if(LF.grupo)partes.push('grupo: '+nomeGrupo(LF.grupo));
  if(LF.categoria)partes.push('categoria: '+nomeCat(LF.categoria));
  if(LF.forma)partes.push('pagamento: '+LF.forma);
  if(LF.inst)partes.push('instituição: '+nomeInst(LF.inst));
  if(LF.veiculo)partes.push('veículo: '+nomeVeic(LF.veiculo));
  if(LF.situacao)partes.push('situação: '+LF.situacao);
  if(LF.deMes&&LF.deAno)partes.push('de '+MESES[+LF.deMes-1]+'/'+LF.deAno);
  if(LF.ateMes&&LF.ateAno)partes.push('até '+MESES[+LF.ateMes-1]+'/'+LF.ateAno);
  return partes.length?('Filtros ativos: '+partes.join(', ')+'.'):'Sem filtros aplicados — considera toda a base de lançamentos.';
}

  abrirExportar({titulo:'Exportar lançamentos',escopoTxt,
    aoCsv:()=>exportarCsvLancamentos(lista),
    aoPdf:()=>exportarPdfLancamentos(lista,tot)});
}

/* escolha do alcance quando o lançamento pertence a uma série recorrente */
function escolherEscopoSerie({titulo,texto,botao='Continuar',perigo=false,total=0,restantes=0}){
  return new Promise(res=>{
    let escolhido=false;
    const op=[['uma','Somente este lançamento','Os demais da série permanecem como estão.'],
      ['proximas','Este e os próximos','Vale para '+restantes+' lançamento(s) desta data em diante.'],
      ['serie','Toda a série','Vale para os '+total+' lançamentos da recorrência.']];
    abrirModal({titulo,pequeno:true,
      corpo:`<p>${texto}</p><div class="radios" role="radiogroup" aria-label="Alcance da alteração">`+
        op.map(([v,t,d],i)=>`<label class="radio-card"><input type="radio" name="escopoSerie" value="${v}"${i===0?' checked':''}>
          <span><b>${t}</b><small>${d}</small></span></label>`).join('')+`</div>`,
      rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn ${perigo?'btn-danger':'btn-primary'}" id="okEsc">${esc(botao)}</button>`,
      aoFechar:()=>{if(!escolhido)res(null);},
      aoAbrir:m=>{m.querySelector('#okEsc').onclick=()=>{escolhido=true;const v=m.querySelector('input[name="escopoSerie"]:checked').value;fecharModal();res(v);};}});
  });
}
const irmaosRecorrencia=l=>D().lancamentos.filter(x=>x.recorrenciaId&&x.recorrenciaId===l.recorrenciaId);

async function excluirLancamento(id){
  const l=D().lancamentos.find(x=>x.id===id);if(!l)return;
  if(l.recorrenciaId){
    const todos=irmaosRecorrencia(l), depois=todos.filter(x=>x.dataParcela>=l.dataParcela);
    const esc0=await escolherEscopoSerie({titulo:'Excluir lançamento recorrente',
      texto:'Este lançamento faz parte de uma recorrência. O que você quer excluir?',
      botao:'Excluir',perigo:true,total:todos.length,restantes:depois.length});
    if(!esc0)return;
    let alvo=[l];
    if(esc0==='proximas')alvo=depois;
    if(esc0==='serie'){alvo=todos;D().recorrencias=D().recorrencias.filter(r=>r.id!==l.recorrenciaId);}
    const ids=new Set(alvo.map(x=>x.id));
    D().lancamentos=D().lancamentos.filter(x=>!ids.has(x.id));ids.forEach(i=>SEL.delete(i));
    salvar();toast(ids.size+' lançamento(s) excluído(s).','ok');renderPagina();return;
  }
  const serie=l.compraId?D().lancamentos.filter(x=>x.compraId===l.compraId).length:0;
  const texto=serie>1?`Este lançamento faz parte de uma compra em ${serie} parcelas. Excluir somente esta parcela?`:'Excluir este lançamento? Esta ação não pode ser desfeita.';
  if(await confirmar({titulo:'Excluir lançamento',texto,botao:'Excluir'})){
    D().lancamentos=D().lancamentos.filter(x=>x.id!==id);SEL.delete(id);salvar();toast('Lançamento excluído.','ok');renderPagina();}
}
