function montarFormLancamento(m,base,edit){
  let tipo=base.tipo;
  const fGrupo=$('#fGrupo',m),fCat=$('#fCategoria',m),fValor=$('#fValor',m);
  moedaMask(fValor);
  function encherGrupos(){
    const gs=D().grupos.filter(g=>g.ativo&&g.tipo===tipo);
    fGrupo.innerHTML=opcoes(gs,{vazio:'Selecione ou escolha pela categoria',selecionado:base.grupoId||''});
  }
  function encherCategorias(){
    const gid=fGrupo.value;
    const cs=D().categorias.filter(c=>c.ativo&&(gid?c.grupoId===gid:grupo(c.grupoId)?.tipo===tipo));
    fCat.innerHTML=opcoes(cs,{vazio:'Selecione a categoria',selecionado:base.categoriaId||''});
  }
  function atualizaContexto(){
    const c=cat(fCat.value);
    const forma=$('#fForma',m).value;
    const ehCartao=forma==='Cartão de crédito';
    $('#boxCartao',m).classList.toggle('hide',!ehCartao);
    const precisaInst=!!(c&&c.fin)||['g-fin-e','g-fin-s'].includes(c?.grupoId);
    $('#boxInst',m).classList.toggle('hide',!precisaInst);
    const precisaVeic=!!(c&&c.veicular);
    $('#boxVeic',m).classList.toggle('hide',!precisaVeic);
    $('#boxCusto',m).classList.toggle('hide',!(precisaVeic&&$('#fVeic',m).value));
    if(ehCartao)previewParcelas();
  }
  function previewParcelas(){
    const n=Math.max(1,Math.min(36,+$('#fParcelas',m).value||1));
    const total=lerMoeda(fValor),primeira=$('#fPrimeira',m).value||$('#fData',m).value;
    const partes=dividirParcelas(total,n);
    $('#fValorParcela',m).textContent=total?fmt(partes[0])+(partes[0]!==partes[n-1]?' a '+fmt(partes[n-1]):''):'—';
    $('#previewParcelas',m).innerHTML=total?partes.map((v,i)=>
      `<div><span>Parcela ${i+1} de ${n} — ${fmtData(addMeses(primeira,i))}</span><b>${fmt(v)}</b></div>`).join('')
      :'<div><span class="muted">Informe o valor para ver a prévia das parcelas.</span></div>';
  }
  function previewRec(){
    const box=$('#boxRec',m);if(!box)return;
    const ativo=$('#fRec',m).checked;box.classList.toggle('hide',!ativo);
    if(!ativo)return;
    const semFim=$('#fRecSemFim',m).checked;
    $('#fRecFim',m).disabled=semFim;$('#fRecQtd',m).disabled=semFim;
    const ini=$('#fRecIni',m).value||HOJE,freq=$('#fFreq',m).value;
    const qtd=semFim?null:(+$('#fRecQtd',m).value||null),ate=semFim?null:($('#fRecFim',m).value||null);
    const datas=ocorrenciasRecorrencia(ini,freq,{ate,qtd});
    const total=lerMoeda(fValor);
    $('#previewRec',m).innerHTML=datas.slice(0,8).map((d,i)=>`<div><span>Ocorrência ${i+1} — ${fmtData(d)}</span><b>${fmt(total)}</b></div>`).join('')
      +(datas.length>8?`<div><span class="muted">e mais ${datas.length-8} ocorrências</span><span></span></div>`:'');
  }
  encherGrupos();encherCategorias();atualizaContexto();
  $$('#fTipo button',m).forEach(b=>b.onclick=()=>{
    tipo=b.dataset.v;$$('#fTipo button',m).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===tipo)));
    base.grupoId='';base.categoriaId='';encherGrupos();encherCategorias();atualizaContexto();});
  fGrupo.onchange=()=>{base.grupoId=fGrupo.value;base.categoriaId='';encherCategorias();atualizaContexto();};
  fCat.onchange=()=>{const c=cat(fCat.value);if(c){base.categoriaId=c.id;if(fGrupo.value!==c.grupoId){fGrupo.value=c.grupoId;base.grupoId=c.grupoId;const v=fCat.value;encherCategorias();fCat.value=v;}}atualizaContexto();};
  $('#fForma',m).onchange=atualizaContexto;
  $('#fVeic',m).onchange=atualizaContexto;
  ['#fParcelas','#fPrimeira'].forEach(s=>{const el=$(s,m);if(el)el.oninput=previewParcelas;});
  fValor.addEventListener('input',()=>{if($('#fForma',m).value==='Cartão de crédito')previewParcelas();previewRec();});
  const fRec=$('#fRec',m);
  if(fRec){fRec.onchange=previewRec;['#fFreq','#fRecIni','#fRecFim','#fRecQtd','#fRecSemFim'].forEach(s=>{const el=$(s,m);if(el)el.onchange=previewRec;});}
  const avisoCasal=()=>{};
  if($('#fCasal',m))$('#fCasal',m).onchange=avisoCasal;
  $('#fData',m).onchange=()=>{const p=$('#fPrimeira',m);if(p&&!p.disabled)p.value=$('#fData',m).value;
    const ri=$('#fRecIni',m);if(ri)ri.value=$('#fData',m).value;previewParcelas();previewRec();avisoCasal();};
  avisoCasal();

  $('#salvarLanc',m).onclick=()=>{
    const valor=lerMoeda(fValor),data=$('#fData',m).value,categoriaId=fCat.value;
    let erro=false;
    $('#eValor',m).textContent='';$('#eData',m).textContent='';$('#eCategoria',m).textContent='';
    if(!valor){$('#eValor',m).textContent='Informe um valor maior que zero.';fValor.setAttribute('aria-invalid','true');erro=true;}else fValor.removeAttribute('aria-invalid');
    if(!data){$('#eData',m).textContent='Informe a data.';erro=true;}
    if(!categoriaId){$('#eCategoria',m).textContent='Escolha a categoria.';fCat.setAttribute('aria-invalid','true');erro=true;}else fCat.removeAttribute('aria-invalid');
    if(erro){toast('Revise os campos destacados.','err');return;}
    const c=cat(categoriaId);
    const comum={tipo,valor,categoriaId,grupoId:c.grupoId,observacao:$('#fObs',m).value.trim(),
      formaPagamento:$('#fForma',m).value,situacaoManual:$('#fSituacao',m).value||null,
      cartaoId:$('#fForma',m).value==='Cartão de crédito'?$('#fCartao',m).value:null,
      instituicaoId:$('#boxInst',m).classList.contains('hide')?null:($('#fInst',m).value||null),
      veiculoId:$('#boxVeic',m).classList.contains('hide')?null:($('#fVeic',m).value||null),
      incluiCustoVeiculo:$('#fCusto',m)?$('#fCusto',m).checked:true,
      casal:!!($('#fCasal',m)&&$('#fCasal',m).checked)};
    if(edit){
      if(edit.recorrenciaId){
        const todos=irmaosRecorrencia(edit), depois=todos.filter(x=>x.dataParcela>=edit.dataParcela);
        escolherEscopoSerie({titulo:'Editar lançamento recorrente',
          texto:'Este lançamento faz parte de uma recorrência. Onde aplicar as alterações?',
          botao:'Salvar',total:todos.length,restantes:depois.length}).then(esc0=>{
            if(!esc0)return;
            let alvo=[edit];
            if(esc0==='proximas')alvo=depois;
            if(esc0==='serie')alvo=todos;
            alvo.forEach(x=>{Object.assign(x,comum);if(x.id===edit.id){x.dataParcela=data;x.dataOriginal=data;}});
            if(esc0!=='uma'){const r=D().recorrencias.find(y=>y.id===edit.recorrenciaId);
              if(r)r.descricao=comum.observacao||nomeCat(categoriaId);}
            salvar();fecharModal();
            toast(alvo.length>1?alvo.length+' lançamentos da série atualizados.':'Lançamento atualizado.','ok');
            renderPagina();});
        return;
      }
      Object.assign(edit,comum,{dataParcela:data,dataOriginal:edit.parcelasTotal?edit.dataOriginal:data});
      salvar();fecharModal();toast('Lançamento atualizado.','ok');renderPagina();return;
    }
    const nParc=$('#fForma',m).value==='Cartão de crédito'?Math.max(1,Math.min(36,+$('#fParcelas',m).value||1)):1;
    const recAtivo=fRec&&fRec.checked;
    if(recAtivo){
      const semFim=$('#fRecSemFim',m).checked,ini=$('#fRecIni',m).value||data,freq=$('#fFreq',m).value;
      const datas=ocorrenciasRecorrencia(ini,freq,{ate:semFim?null:($('#fRecFim',m).value||null),qtd:semFim?null:(+$('#fRecQtd',m).value||null)});
      const rid=uid('r');
      D().recorrencias.push({id:rid,descricao:comum.observacao||nomeCat(categoriaId),frequencia:freq,dataInicial:ini,criadoEm:HOJE});
      datas.forEach(d=>D().lancamentos.unshift({id:uid('l'),...comum,dataParcela:d,dataOriginal:d,parcelaAtual:null,parcelasTotal:null,compraId:null,recorrenciaId:rid}));
      salvar();fecharModal();toast(`Recorrência criada com ${datas.length} ocorrências.`,'ok');renderPagina();return;
    }
    if(nParc>1){
      const primeira=$('#fPrimeira',m).value||data,partes=dividirParcelas(valor,nParc),compraId=uid('c');

function sazonalidadeMensal(){
  const idxs=mesesDisponiveis();

  idxs.forEach(idx=>{
    const doMes=LV().filter(l=>mesIndex(l.dataParcela)===idx&&ehRealizado(l));
    const e=somaV(doMes.filter(l=>l.tipo==='entrada')),s=somaV(doMes.filter(l=>l.tipo==='saida'));
    const m=idx%12;porMes[m].e+=e;porMes[m].s+=s;porMes[m].n++;
  });
  return porMes.map((o,m)=>({mes:MESES_ABR[m],entradas:o.n?round2(o.e/o.n):0,saidas:o.n?round2(o.s/o.n):0,n:o.n}));
}
function mediaMovelSerie(meses,janela=3,chave='resultado'){
  return meses.map((m,i)=>{
    if(i<janela-1)return null;
    const fatia=meses.slice(i-janela+1,i+1);
    return round2(fatia.reduce((a,x)=>a+x[chave],0)/janela);
  });
}

function idxsInfo(saz){const anos=saz.reduce((a,s)=>Math.max(a,s.n),0);return anos+(anos===1?' ano de dados':' anos de dados');}
function projetar(ateIdx){
  const hist=serieMensal(MES_ATUAL-5,MES_ATUAL-1);
  const mediaE=hist.length?hist.reduce((a,m)=>a+m.entradas,0)/hist.length:0;
  const mediaS=hist.length?hist.reduce((a,m)=>a+m.saidas,0)/hist.length:0;
  const meses=[];let acum=acumuladoAte(MES_ATUAL-1);
  const cenarios={conservador:{e:0.95,s:1.08},base:{e:1,s:1},otimista:{e:1.06,s:0.94}};
  const saida={};
  for(const c in cenarios)saida[c]={meses:[],acumulado:acum,entradas:0,saidas:0};
  for(let i=MES_ATUAL;i<=ateIdx;i++){
    const agendados=LV().filter(l=>mesIndex(l.dataParcela)===i&&situacao(l)!=='cancelado');
    const agE=somaV(agendados.filter(l=>l.tipo==='entrada')),agS=somaV(agendados.filter(l=>l.tipo==='saida'));
    const baseE=Math.max(agE,mediaE),baseS=Math.max(agS,mediaS);
    meses.push(i);
    for(const c in cenarios){
      const e=round2(baseE*cenarios[c].e),s=round2(baseS*cenarios[c].s);
      saida[c].entradas=round2(saida[c].entradas+e);saida[c].saidas=round2(saida[c].saidas+s);
      saida[c].acumulado=round2(saida[c].acumulado+e-s);
      saida[c].meses.push({idx:i,entradas:e,saidas:s,resultado:round2(e-s),acumulado:saida[c].acumulado});
    }
  }
  return {meses,cenarios:saida,mediaE:round2(mediaE),mediaS:round2(mediaS),baseHist:hist.length};
}

function analisesAutomaticas(){
  const out=[],s=serieMensal(MES_ATUAL-5,MES_ATUAL);
  const ultimos=LV().filter(l=>mesIndex(l.dataParcela)>=MES_ATUAL-5&&mesIndex(l.dataParcela)<=MES_ATUAL);
  const cur=s[s.length-1],ant=s[s.length-2];
  if(ant&&ant.saidas>0){const v=variacao(cur.saidas,ant.saidas);
    out.push({nivel:v>0?'neg':'pos',titulo:v>0?'Aumento de despesas.':'Redução de despesas.',
      texto:`Saídas realizadas passaram de ${fmt(ant.saidas)} em ${ant.label} para ${fmt(cur.saidas)} em ${cur.label} (${fmtPct(v)}).`,
      base:`Critério: soma das saídas realizadas de cada mês`});}
  const a=porCategoria(ultimos.filter(l=>mesIndex(l.dataParcela)===MES_ATUAL),'saida');
  const b=porCategoria(ultimos.filter(l=>mesIndex(l.dataParcela)===MES_ATUAL-1),'saida');
  a.itens.slice(0,6).forEach(i=>{const p=b.itens.find(x=>x.id===i.id);
    if(p&&Math.abs(i.valor-p.valor)>=Math.max(150,p.valor*0.35))
      out.push({nivel:i.valor>p.valor?'warn':'pos',titulo:`Mudança relevante em ${i.nome}.`,
        texto:`De ${fmt(p.valor)} para ${fmt(i.valor)} (${fmtPct(variacao(i.valor,p.valor))}).`,
        base:`Comparação: ${mesLabel(MES_ATUAL,false)} contra ${mesLabel(MES_ATUAL-1,false)}`});});
  const obs=new Map();
  ultimos.filter(l=>l.tipo==='saida'&&ehRealizado(l)&&l.observacao).forEach(l=>{
    const k=l.observacao.split('—')[0].trim();const o=obs.get(k)||{n:0,v:0,meses:new Set()};
    o.n++;o.v+=cents(l.valor);o.meses.add(mesIndex(l.dataParcela));obs.set(k,o);});
  const recorrentes=[...obs].filter(([,o])=>o.meses.size>=4).sort((x,y)=>y[1].v-x[1].v).slice(0,3);
  recorrentes.forEach(([k,o])=>out.push({nivel:'info',titulo:`Estabelecimento recorrente: ${k}.`,
    texto:`${o.n} lançamentos em ${o.meses.size} meses diferentes, somando ${fmt(o.v/100)}.`,
    base:'Critério: repetição do texto da observação nos últimos 6 meses'}));
  const fixas=[...obs].filter(([,o])=>o.meses.size>=5&&o.n<=8);
  if(fixas.length)out.push({nivel:'info',titulo:'Despesas constantes identificadas.',
    texto:`${fixas.length} descrições aparecem praticamente todos os meses — são candidatas naturais a recorrência.`,
    base:'Critério: presença em 5 ou 6 dos últimos 6 meses'});
  if(s.length>=3){const dir=s[s.length-1].resultado-s[s.length-3].resultado;
    out.push({nivel:dir>=0?'pos':'warn',titulo:dir>=0?'Tendência de alta no resultado.':'Tendência de queda no resultado.',
      texto:`O resultado saiu de ${fmt(s[s.length-3].resultado)} em ${s[s.length-3].label} para ${fmt(cur.resultado)} em ${cur.label}.`,
      base:'Critério: diferença entre o primeiro e o último ponto de três meses'});}
  const neg=s.filter(m=>m.resultado<0);
  if(neg.length)out.push({nivel:'neg',titulo:'Risco de resultado negativo.',
    texto:`${neg.length} dos últimos ${s.length} meses fecharam negativos (${neg.map(m=>m.label).join(', ')}).`,
    base:'Critério: resultado mensal realizado menor que zero'});
  const taxaCur=cur&&cur.entradas>0?round2((cur.entradas-cur.saidas)/cur.entradas*100):null;
  const taxaAnt=ant&&ant.entradas>0?round2((ant.entradas-ant.saidas)/ant.entradas*100):null;
  if(taxaCur!==null&&taxaAnt!==null&&Math.abs(taxaCur-taxaAnt)>=5)
    out.push({nivel:taxaCur>taxaAnt?'pos':'warn',titulo:taxaCur>taxaAnt?'Taxa de poupança melhorou.':'Taxa de poupança piorou.',
      texto:`De ${NUM.format(taxaAnt)}% em ${ant.label} para ${NUM.format(taxaCur)}% em ${cur.label} da renda não comprometida com saídas.`,
      base:'Critério: (entradas − saídas) ÷ entradas, mês contra mês'});
  const formasUlt=agrupar(ultimos,'formas');
  const totalFormasUlt=[...formasUlt.values()].reduce((a,v)=>a+v,0);
  const formaTopUlt=[...formasUlt.entries()].sort((x,y)=>y[1]-x[1])[0];
  if(formaTopUlt&&totalFormasUlt>0){const pct=round2(formaTopUlt[1]/totalFormasUlt*100);
    if(pct>=45)out.push({nivel:'info',titulo:`Concentração em ${formaTopUlt[0]}.`,
      texto:`${NUM.format(pct)}% das saídas realizadas nos últimos 6 meses usaram essa forma de pagamento.`,
      base:'Critério: participação da forma de pagamento no total de saídas realizadas'});}
  const saidasUlt=ultimos.filter(l=>l.tipo==='saida'&&ehRealizado(l));
  if(saidasUlt.length>=5){const media=somaV(saidasUlt)/saidasUlt.length;
    const maior=saidasUlt.slice().sort((x,y)=>y.valor-x.valor)[0];
    if(maior&&maior.valor>=media*4&&maior.valor>=300)
      out.push({nivel:'warn',titulo:'Lançamento fora do padrão identificado.',
        texto:`${maior.observacao||nomeCat(maior.categoriaId)} em ${fmtData(maior.dataParcela)}, de ${fmt(maior.valor)} — bem acima da média de saídas do período (${fmt(round2(media))}).`,
        base:'Critério: valor pelo menos 4× a média das saídas realizadas nos últimos 6 meses'});}
  if(out.length===0)out.push({nivel:'info',titulo:'Sem sinais relevantes.',texto:'Os dados do período não apresentaram variações acima dos limites usados nesta versão.',base:'Base: últimos 6 meses'});
  return out;
}

/* ------------------------- exportação de Análises ------------------------- */
function rotuloDim(dim){return dim==='grupos'?'Grupo':dim==='categorias'?'Categoria':dim==='instituicoes'?'Instituição':dim==='formas'?'Forma de pagamento':'Veículo';}
function dadosExportAnalises(){
  const iv=intervaloComparacao();
  const listaA=filtrarLista(LV(),{intervalo:iv.A}),listaB=filtrarLista(LV(),{intervalo:iv.B});
  const tA=totais(listaA),tB=totais(listaB);
  const mA=agrupar(listaA,ANA.dim),mB=agrupar(listaB,ANA.dim);
  const chaves=[...new Set([...mA.keys(),...mB.keys()])]
    .map(k=>({k,a:(mA.get(k)||0)/100,b:(mB.get(k)||0)/100})).sort((x,y)=>(y.a+y.b)-(x.a+x.b));
  const comp={iv,tA,tB,chaves,dim:ANA.dim};

  const {de,ate}=PERIODOS.ana;
  const tMeses=serieMensal(de,ate);
  const tLista=filtrarLista(LV(),{intervalo:{ini:de,fim:ate}});
  const saz=sazonalidadeMensal();
  const formasOrd=[...agrupar(tLista,'formas').entries()].sort((a,b)=>b[1]-a[1]);
  const topLanc=topLancamentosPeriodo(tLista,10);
  const tend={de,ate,meses:tMeses,saz,formasOrd,topLanc};

  const proj=projetar(+ANA.projAte);
  const autos=analisesAutomaticas();
  return {comp,tend,proj,autos};
}

    NUM.format(proj.cenarios.conservador.meses[i].acumulado),NUM.format(m.acumulado),NUM.format(proj.cenarios.otimista.meses[i].acumulado)));
  add('');

  autos.forEach(a=>add(a.titulo,a.texto,a.base));
  await salvarCsv('relatorio-analises-'+HOJE+'.csv',lin);
}

/* ============================= Investimentos ============================= */
const INV={inst:'',op:'',grupo:'',categoria:'',detalhe:null};
const OPS={rendimento:'Rendimentos',resgate:'Resgates',aporte:'Aportes',taxa:'Taxas'};
function lancamentosFinanceiros(){
  const {de,ate}=PERIODOS.inv;
  return LV().filter(l=>{
    const c=cat(l.categoriaId);if(!c||!c.fin)return false;
    const mi=mesIndex(l.dataParcela);if(mi<de||mi>ate)return false;
    if(situacao(l)==='cancelado')return false;
    if(INV.inst&&l.instituicaoId!==INV.inst)return false;
    if(INV.op&&c.fin!==INV.op)return false;
    if(INV.grupo&&l.grupoId!==INV.grupo)return false;
    if(INV.categoria&&l.categoriaId!==INV.categoria)return false;
    return true;});
}
function renderInvestimentos(){
  const lista=lancamentosFinanceiros(),real=lista.filter(ehRealizado);
  const porFin=f=>somaV(real.filter(l=>cat(l.categoriaId).fin===f));
  const aportes=porFin('aporte'),resgates=porFin('resgate'),rend=porFin('rendimento'),taxas=porFin('taxa');
  const liquido=round2(rend-taxas);
  const rentab=aportes>0?round2(liquido/aportes*100):null;
  const meses=[];for(let i=PERIODOS.inv.de;i<=PERIODOS.inv.ate;i++)meses.push(i);
  const serie=meses.map(i=>{const doMes=real.filter(l=>mesIndex(l.dataParcela)===i);
    return {idx:i,rend:somaV(doMes.filter(l=>cat(l.categoriaId).fin==='rendimento')),
      aporte:somaV(doMes.filter(l=>cat(l.categoriaId).fin==='aporte')),
      resgate:somaV(doMes.filter(l=>cat(l.categoriaId).fin==='resgate'))};});
  let ac=0;serie.forEach(m=>{ac=round2(ac+m.aporte-m.resgate);m.acumulado=ac;});
  const insts=D().instituicoes.map(i=>({nome:i.nome,id:i.id,
    rend:somaV(real.filter(l=>l.instituicaoId===i.id&&cat(l.categoriaId).fin==='rendimento')),

/* ---------- exportação de Investimentos ---------- */
function exportarInvestimentos({aportes,resgates,rend,taxas,liquido,rentab,serie,insts,det}){
  if(!det.length){toast('Nenhuma operação financeira no filtro atual para exportar.','warn');return;}
  const escopoTxt=mesLabel(PERIODOS.inv.de,false)+' a '+mesLabel(PERIODOS.inv.ate,false)+' · '+det.length+' '+(det.length===1?'registro':'registros')+' — indicadores, evolução mensal, comparação entre instituições e os lançamentos considerados.';
  abrirExportar({titulo:'Exportar investimentos',escopoTxt,
    aoCsv:()=>exportarCsvInvestimentos({aportes,resgates,rend,taxas,liquido,rentab,serie,insts,det}),
    aoPdf:()=>exportarPdfInvestimentos({aportes,resgates,rend,taxas,liquido,rentab,serie,insts,det})});
}
async function exportarCsvInvestimentos({aportes,resgates,rend,taxas,liquido,rentab,serie,insts,det}){
  const lin=[];const add=(...c)=>lin.push(linhaCsv(...c));
  add('Relatório — Investimentos · Meu Fluxo · '+rotuloRelatorio());
  add('Gerado em',fmtData(HOJE));
  add('Período',mesLabel(PERIODOS.inv.de,false)+' a '+mesLabel(PERIODOS.inv.ate,false));
  add('');
  add('Indicadores');
  add('Total de aportes',NUM.format(aportes));
  add('Total de resgates',NUM.format(resgates));
  add('Rendimentos recebidos',NUM.format(rend));
  add('Taxas',NUM.format(taxas));
  add('Resultado líquido',NUM.format(liquido));
  add('Rentabilidade estimada (%)',rentab===null?'—':NUM.format(rentab));
  add('');
  add('Evolução mensal');
  add('Mês','Rendimentos','Aportes','Resgates','Saldo aportado acumulado');
  serie.forEach(m=>add(mesLabel(m.idx,false),NUM.format(m.rend),NUM.format(m.aporte),NUM.format(m.resgate),NUM.format(m.acumulado)));
  add('');
  add('Comparação entre instituições');
  add('Instituição','Rendimentos','Aportes');
  insts.forEach(i=>add(i.nome,NUM.format(i.rend),NUM.format(i.aporte)));
  add('');
  add('Lançamentos considerados');
  add('Tipo','Valor','Data','Grupo','Categoria','Observação','Pagamento','Situação');
  det.forEach(l=>add(l.tipo==='entrada'?'Entrada':'Saída',NUM.format(l.valor),fmtData(l.dataParcela),nomeGrupo(l.grupoId),
    nomeCat(l.categoriaId),l.observacao||'',l.formaPagamento,situacao(l)==='realizado'?'Realizado':situacao(l)==='futuro'?'Futuro':'Cancelado'));
  await salvarCsv('relatorio-investimentos-'+HOJE+'.csv',lin);
}
function exportarPdfInvestimentos({aportes,resgates,rend,taxas,liquido,rentab,serie,insts,det}){
  const imgEvo=CHARTS['chartInvEvo']?CHARTS['chartInvEvo'].toBase64Image():null;
  const imgComp=CHARTS['chartInvComp']?CHARTS['chartInvComp'].toBase64Image():null;
  const imgInst=CHARTS['chartInvInst']?CHARTS['chartInvInst'].toBase64Image():null;
  let html=`<div class="rel-print"><h1>Investimentos</h1>
    <p class="tiny muted">Meu Fluxo — ${esc(rotuloRelatorio())} · Gerado em ${fmtData(HOJE)} · Período: ${mesLabel(PERIODOS.inv.de,false)} a ${mesLabel(PERIODOS.inv.ate,false)}</p>
    <div class="rel-kpis">
      <div><b>Total de aportes</b><span>${fmt(aportes)}</span></div>
      <div><b>Total de resgates</b><span>${fmt(resgates)}</span></div>
      <div><b>Rendimentos recebidos</b><span>${fmt(rend)}</span></div>
      <div><b>Taxas</b><span>${fmt(taxas)}</span></div>
      <div><b>Resultado líquido</b><span>${fmt(liquido)}</span></div>
      <div><b>Rentabilidade estimada</b><span>${rentab===null?'—':NUM.format(rentab)+'%'}</span></div>
    </div>`;
  if(imgEvo)html+=`<h2>Evolução mensal</h2><img src="${imgEvo}">`;
  if(imgComp)html+=`<h2>Composição</h2><img src="${imgComp}" style="max-width:320px">`;
  if(imgInst)html+=`<h2>Comparação entre instituições</h2><img src="${imgInst}">`;
  html+=`<h2 style="margin-top:22px">Lançamentos considerados</h2>
    <table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Observação</th><th>Pagamento</th><th>Valor</th></tr></thead>
    <tbody>${det.map(l=>`<tr><td>${fmtData(l.dataParcela)}</td><td>${l.tipo==='entrada'?'Entrada':'Saída'}</td><td>${esc(nomeCat(l.categoriaId))}</td>
      <td>${esc(l.observacao||'—')}</td><td>${esc(l.formaPagamento)}</td><td>${fmt(l.valor)}</td></tr>`).join('')}</tbody></table></div>`;
  imprimirRelatorio(html);
}

const VEI={sel:'todos'};
function renderVeiculos(){
  if(VEI.sel!=='todos'&&!veiculosVisiveis().some(v=>v.id===VEI.sel))VEI.sel='todos';
  const {de,ate}=PERIODOS.vei,nMeses=ate-de+1;
  const todos=LV().filter(l=>l.veiculoId&&l.tipo==='saida'&&situacao(l)!=='cancelado');
  const noPeriodo=todos.filter(l=>{const mi=mesIndex(l.dataParcela);return mi>=de&&mi<=ate&&(VEI.sel==='todos'||l.veiculoId===VEI.sel);});
  const operacionais=noPeriodo.filter(l=>l.incluiCustoVeiculo!==false&&ehRealizado(l));
  const custo=somaV(operacionais),media=nMeses?round2(custo/nMeses):0;
  const anoAtual=todos.filter(l=>pYMD(l.dataParcela).y===HOJE_P.y&&l.incluiCustoVeiculo!==false&&ehRealizado(l)&&(VEI.sel==='todos'||l.veiculoId===VEI.sel));
  const custoAno=somaV(anoAtual);
  const porMes=new Map();operacionais.forEach(l=>{const i=mesIndex(l.dataParcela);porMes.set(i,(porMes.get(i)||0)+cents(l.valor));});
  const serie=[];for(let i=de;i<=ate;i++)serie.push({idx:i,valor:(porMes.get(i)||0)/100});
  const maior=serie.reduce((a,b)=>b.valor>(a?.valor??-1)?b:a,null);
  const pc=porCategoria(operacionais,'saida');
  const antIni=de-nMeses,antFim=de-1;
  const antLista=todos.filter(l=>{const mi=mesIndex(l.dataParcela);return mi>=antIni&&mi<=antFim&&l.incluiCustoVeiculo!==false&&ehRealizado(l)&&(VEI.sel==='todos'||l.veiculoId===VEI.sel);});
  const custoAnt=somaV(antLista);
  const comparativo=veiculosVisiveis().map(v=>({nome:v.nome+(v._dono?' ('+nomeParceiro()+')':''),valor:somaV(todos.filter(l=>l.veiculoId===v.id&&l.incluiCustoVeiculo!==false&&ehRealizado(l)&&mesIndex(l.dataParcela)>=de&&mesIndex(l.dataParcela)<=ate))}));
  const fora=noPeriodo.filter(l=>l.incluiCustoVeiculo===false);

  $('#page-veiculos').innerHTML=`
   <div class="note info" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
     <span>Painel derivado dos lançamentos que têm um veículo vinculado. Os veículos são cadastrados em Configurações; aqui não existe cadastro financeiro próprio.</span></div>
   <div class="card" style="margin-bottom:14px"><div class="filterbar">
     <div class="field"><label for="veiSel">Veículo</label><select id="veiSel" class="input">
       <option value="todos"${VEI.sel==='todos'?' selected':''}>Todos os veículos</option>
       ${opcoes(veiculosVisiveis().map(v=>v._dono?{...v,nome:v.nome+' ('+nomeParceiro()+')'}:v),{selecionado:VEI.sel})}</select></div>
     <div class="field"><label for="veiDe">De</label><select id="veiDe" class="input">${optMesIdx(de)}</select></div>
     <div class="field"><label for="veiAte">Até</label><select id="veiAte" class="input">${optMesIdx(ate)}</select></div>
     <button class="icon-btn" id="veiExportar" aria-label="Exportar dados do veículo">${SVG_EXPORTAR}</button>
     <div class="spacer desk-only"></div>
     <button class="btn btn-primary" id="veiNovo">Novo lançamento com este veículo</button>
   </div></div>
   <div class="kpi-row scroller">
     <div class="kpi k-neg"><div class="kpi-label">Custo operacional no período</div><div class="kpi-value">${fmt(custo)}</div>
       <div class="kpi-foot">${badgeTrend(variacao(custo,custoAnt),true)} <span>ante os ${nMeses} meses anteriores</span></div></div>
     <div class="kpi k-brand"><div class="kpi-label">Média mensal</div><div class="kpi-value">${fmt(media)}</div><div class="tiny muted">${nMeses} meses no período</div></div>
     <div class="kpi k-brand"><div class="kpi-label">Custo no ano de ${HOJE_P.y}</div><div class="kpi-value">${fmt(custoAno)}</div><div class="tiny muted">Somente custos operacionais</div></div>
     <div class="kpi k-neg"><div class="kpi-label">Maior mês de gasto</div><div class="kpi-value">${maior&&maior.valor?fmt(maior.valor):'—'}</div>
       <div class="tiny muted">${maior&&maior.valor?mesLabel(maior.idx,false):'sem movimentação'}</div></div>
   </div>
   ${pc.itens.length?`<div class="note" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
     <span>Categoria mais representativa: <b>${esc(pc.itens[0].nome)}</b>, com ${fmt(pc.itens[0].valor)} (${NUM.format(pc.itens[0].pct)}% do custo operacional do período).</span></div>`:''}
   <div class="split" style="margin-bottom:14px">
     <div class="card"><div class="card-head"><h2>Evolução mensal</h2></div>
       <div class="chart-box"><div class="chart-canvas" id="veiEvoBox"><canvas id="chartVeiEvo" role="img" aria-label="Evolução mensal do custo do veículo"></canvas></div></div></div>
     <div class="card"><div class="card-head"><h2>Custos por categoria</h2></div>
       <div class="chart-box"><div class="chart-canvas" id="veiCatBox">${pc.itens.length?'<canvas id="chartVeiCat" role="img" aria-label="Custos por categoria"></canvas>':''}</div></div></div>
   </div>
   <div class="card" style="margin-bottom:14px"><div class="card-head"><h2>Comparação entre veículos</h2>
     <span class="tiny muted">Custo operacional no mesmo período</span></div>
     <div class="chart-box"><div class="chart-canvas" style="height:190px"><canvas id="chartVeiCmp" role="img" aria-label="Comparação de custo entre veículos"></canvas></div></div></div>
   ${fora.length?`<div class="card" style="margin-bottom:14px"><div class="card-head"><h2>Fora da média operacional</h2>
     <span class="tiny muted">${fora.length} lançamentos · ${fmt(somaV(fora))}</span></div>
     <div class="card-pad"><p class="small muted" style="margin-bottom:10px">Estes lançamentos continuam no fluxo financeiro geral, mas não entram no custo operacional do veículo.</p>
     ${fora.map(l=>`<div class="alert-item"><span class="alert-ico a-info">✕</span><div><p><b>${esc(l.observacao||nomeCat(l.categoriaId))}</b> — ${fmt(l.valor)}</p>
       <div class="tiny">${fmtData(l.dataParcela)} · ${esc(nomeCat(l.categoriaId))} · ${esc(nomeVeic(l.veiculoId))}</div></div></div>`).join('')}</div></div>`:''}
   <div class="card"><div class="card-head"><h2>Lançamentos do veículo</h2>
     <span class="tiny muted">Use o botão “Inclui/Fora” para ajustar a média operacional</span></div>
     <div class="table-wrap" id="veiTabela"></div></div>`;

  const ordenados=soRegistros(noPeriodo).sort((a,b)=>a.dataParcela<b.dataParcela?1:-1);
  $('#veiTabela').innerHTML=ordenados.length?`<table class="tbl"><thead><tr><th>Data</th><th>Veículo</th><th>Categoria</th><th>Observação</th><th class="r">Valor</th><th>Custo operacional</th><th>Situação</th><th class="r">Ações</th></tr></thead>
    <tbody>${ordenados.map(l=>`<tr><td>${fmtData(l.dataParcela)}</td><td>${esc(nomeVeic(l.veiculoId))}</td><td>${esc(nomeCat(l.categoriaId))}</td>
      <td class="wrap">${esc(l.observacao||'—')}</td><td class="r money neg">− ${fmt(l.valor)}</td>
      <td>${ehMeu(l)?`<button class="btn btn-sm" data-toggle="${l.id}">${l.incluiCustoVeiculo!==false?'Inclui':'Fora'}</button>`:`<span class="tag">${l.incluiCustoVeiculo!==false?'Inclui':'Fora'}</span>`}</td>

<script>
/* =========================================================================
   Bloco 6: Empréstimos (módulo independente) e Capital e Liquidez
   ========================================================================= */
function diasEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function taxaEm(ct,data){
  const h=ct.historicoTaxa&&ct.historicoTaxa.length?ct.historicoTaxa:[{data:ct.dataInicio,taxa:ct.taxaMensal}];
  let taxa=h[0].taxa;
  for(const p of h){if(p.data>data)break;taxa=p.taxa;}
  return taxa;
}
function calcContrato(ct,ate=HOJE){
  const ev=[...ct.eventos].sort((a,b)=>a.data<b.data?-1:1);
  let principal=0,juros=0,last=ev.length?ev[0].data:ct.dataInicio;
  const hist=[],tot={principal:0,recebido:0,amort:0,jurosRec:0,jurosGer:0};
  // Acresce juros simples entre "last" e "d", dividindo o intervalo em
  // sub-trechos sempre que houver mudança de taxa registrada no meio dele —
  // cada sub-trecho usa a taxa vigente no início dele, então uma mudança de
  // taxa hoje nunca altera o saldo/histórico já calculado antes de hoje.
  const acrescer=d=>{
    if(d<=last)return;
    const cortes=(ct.historicoTaxa||[]).map(p=>p.data).filter(dt=>dt>last&&dt<d).sort();
    let cursor=last;
    for(const corte of [...cortes,d]){
      const n=diasEntre(cursor,corte);
      if(n>0&&(principal+juros)>0){
        const j=round2((principal+juros)*(taxaEm(ct,cursor)/100)*(n/30));
        juros=round2(juros+j);tot.jurosGer=round2(tot.jurosGer+j);
      }
      cursor=corte;
    }
    last=d;
  };
  ev.forEach(e=>{
    if(e.data>ate)return;
    acrescer(e.data);
    if(e.tipo==='emprestimo'){principal=round2(principal+e.valor);tot.principal=round2(tot.principal+e.valor);
      hist.push({...e,jurosPagos:0,amort:0,saldo:round2(principal+juros)});}
    else{const pj=Math.min(juros,e.valor),am=round2(e.valor-pj);
      juros=round2(juros-pj);principal=round2(Math.max(0,principal-am));
      tot.recebido=round2(tot.recebido+e.valor);tot.jurosRec=round2(tot.jurosRec+pj);tot.amort=round2(tot.amort+am);
      hist.push({...e,jurosPagos:pj,amort:am,saldo:round2(principal+juros)});}
  });
  acrescer(ate);
  return {hist,principal:round2(principal),juros:round2(juros),saldo:round2(principal+juros),tot};
}
function cronogramaContrato(ct,meses=6){
  const ini=mesIndex(ct.dataInicio),fim=MES_ATUAL+meses,linhas=[];
  for(let i=ini;i<=fim;i++){
    const y=Math.floor(i/12),m=i%12+1,fimMes=ymd(y,m,ultimoDia(y,m));
    const a=calcContrato(ct,ymd(y,m,1)),b=calcContrato(ct,fimMes);
    const evs=ct.eventos.filter(e=>mesIndex(e.data)===i);
    linhas.push({idx:i,saldoIni:a.saldo,juros:round2(b.tot.jurosGer-a.tot.jurosGer),
      emprestado:somaV(evs.filter(e=>e.tipo==='emprestimo')),recebido:somaV(evs.filter(e=>e.tipo==='pagamento')),
      saldoFim:b.saldo,projetado:i>MES_ATUAL});
  }
  return linhas;
}
const EMP={contrato:null,historicoAberto:false,proxAberto:false,filtroPessoa:'',filtroContrato:''};
function renderEmprestimos(){
  const {pessoas,contratos:todosContratos}=D().emprestimos;

  const filtroAtivo=!!(EMP.filtroPessoa||EMP.filtroContrato);

  const pessoasExibidas=filtroAtivo?pessoas.filter(p=>idsComContrato.has(p.id)):pessoas;
  const contratosParaSelect=todosContratos.filter(c=>!EMP.filtroPessoa||c.pessoaId===EMP.filtroPessoa)

  const calc=contratos.map(c=>({c,r:calcContrato(c)}));
  const T=calc.reduce((a,{r})=>({principal:round2(a.principal+r.tot.principal),saldo:round2(a.saldo+r.saldo),
    recebido:round2(a.recebido+r.tot.recebido),amort:round2(a.amort+r.tot.amort),
    jurosGer:round2(a.jurosGer+r.tot.jurosGer),jurosRec:round2(a.jurosRec+r.tot.jurosRec)}),
    {principal:0,saldo:0,recebido:0,amort:0,jurosGer:0,jurosRec:0});
  const jurosProj=round2(calc.reduce((a,{c,r})=>a+(r.saldo*(Math.pow(1+c.taxaMensal/100,6)-1)),0));
  const ativos=calc.filter(({r})=>r.saldo>0.5);
  const pessoasAtivas=new Set(ativos.map(({c})=>c.pessoaId)).size;

  $('#page-emprestimos').innerHTML=`
   <div class="note warn" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
     <span>Módulo independente: estes valores não entram no fluxo de caixa, em Investimentos nem em Veículos. Os juros usam um cálculo simples por dias corridos sobre o saldo devedor; a versão definitiva precisará de uma regra financeira formalmente validada.</span></div>
   <div class="card" style="margin-bottom:14px">

       <div class="field"><label for="empFiltroContrato">Contrato</label><select id="empFiltroContrato" class="input">${opcoes(contratosParaSelect,{vazio:'Todos',selecionado:EMP.filtroContrato})}</select></div>
       <button class="btn btn-ghost" id="empLimparFiltro">Limpar filtro</button>
       <div class="spacer desk-only"></div>
       <button class="btn btn-primary" id="empExportar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Exportar relatório</button>
     </div>
     ${filtroAtivo?`<div class="scope-note" style="margin:0 16px 14px"><b>Filtro ativo:</b> indicadores, gráficos e listas abaixo consideram apenas ${EMP.filtroContrato?'o contrato selecionado':'os contratos de '+esc(pessoas.find(p=>p.id===EMP.filtroPessoa)?.nome||'—')}.</div>`:''}
   </div>
   <div class="kpi-row scroller">
     <div class="kpi k-brand"><div class="kpi-label">Principal emprestado</div><div class="kpi-value">${fmt(T.principal)}</div><div class="tiny muted">Somando valores adicionais</div></div>
     <div class="kpi k-neg"><div class="kpi-label">Saldo total a receber</div><div class="kpi-value">${fmt(T.saldo)}</div><div class="tiny muted">Principal em aberto + juros acumulados</div></div>
     <div class="kpi k-pos"><div class="kpi-label">Total recebido</div><div class="kpi-value">${fmt(T.recebido)}</div><div class="tiny muted">${fmt(T.amort)} de amortização · ${fmt(T.jurosRec)} de juros</div></div>
     <div class="kpi k-brand"><div class="kpi-label">Juros gerados</div><div class="kpi-value">${fmt(T.jurosGer)}</div><div class="tiny muted">${fmt(round2(T.jurosGer-T.jurosRec))} ainda não recebidos</div></div>
   </div>
   <div class="split-even" style="margin-bottom:14px">
     <div class="card card-pad"><div class="kpi-label">Juros projetados para 6 meses</div>
       <div class="kpi-value" style="margin:6px 0">${fmt(jurosProj)}</div>
       <p class="tiny muted">Considera o saldo atual de cada contrato e a taxa mensal cadastrada, sem novos pagamentos.</p></div>
     <div class="card card-pad"><div class="kpi-label">Contratos ativos</div>
       <div class="kpi-value" style="margin:6px 0">${ativos.length} <span class="tiny muted" style="font-weight:400">de ${contratos.length}</span></div>
       <p class="tiny muted">${pessoasAtivas} ${pessoasAtivas===1?'pessoa com saldo em aberto':'pessoas com saldo em aberto'} · ${pessoas.length} cadastradas</p></div>

   <div class="split" style="margin-bottom:14px">

  $('#empTabela').innerHTML=pessoasExibidas.length?`<table class="tbl"><thead><tr><th>Pessoa</th><th>Contratos</th><th class="r">Principal</th>

    :(filtroAtivo?vazio('Nada no filtro atual','Nenhum contrato corresponde ao filtro selecionado.'):vazio('Nenhuma pessoa cadastrada','Cadastre uma pessoa para registrar contratos de empréstimo.'));

  $('#empProx').innerHTML=ativos.length?`<table class="tbl"><thead><tr><th>Pessoa</th><th>Contrato</th><th class="r">Saldo hoje</th>

      return `<tr><td>${esc(pessoas.find(p=>p.id===c.pessoaId)?.nome||'—')}</td><td>${fmtData(c.dataInicio)} · ${NUM.format(c.taxaMensal)}% ao mês</td>
        <td class="r money">${fmt(r.saldo)}</td><td class="r money">${fmt(round2(r.saldo*t))}</td>
        <td class="r money">${fmt(round2(r.saldo*Math.pow(1+t,3)))}</td></tr>`;}).join('')}</tbody></table>`
    :vazio('Sem saldo em aberto','Todos os contratos estão quitados.');

  $$('#empTabela [data-ct]').forEach(b=>b.onclick=()=>{EMP.contrato=b.dataset.ct;renderEmprestimos();
    setTimeout(()=>$('#empDetalhe')?.scrollIntoView({behavior:'smooth',block:'start'}),60);});
  $('#empNovaPessoa').onclick=()=>formPessoa();
  $('#empNovoContrato').onclick=()=>formContrato();
  $('#empProxToggle').onclick=()=>{EMP.proxAberto=!EMP.proxAberto;renderEmprestimos();};

    if(e.target.value){const c=todosContratos.find(x=>x.id===e.target.value);if(c)EMP.filtroPessoa=c.pessoaId;}
    renderEmprestimos();};
  $('#empLimparFiltro').onclick=()=>{EMP.filtroPessoa='';EMP.filtroContrato='';renderEmprestimos();};
  $('#empExportar').onclick=()=>abrirExportEmprestimos(contratos,pessoas,calc);
  if(EMP.contrato)renderDetalheContrato();

  const meses=[];for(let i=MES_ATUAL-11;i<=MES_ATUAL;i++)meses.push(i);
  const serie=meses.map(i=>{const y=Math.floor(i/12),m=i%12+1,d=ymd(y,m,ultimoDia(y,m));
    return {idx:i,saldo:round2(contratos.reduce((a,c)=>a+calcContrato(c,d>HOJE?HOJE:d).saldo,0))};});
  desenharGrafico('chartEmpEvo',{type:'line',data:{labels:serie.map(m=>mesLabel(m.idx)),
      datasets:[{label:'Saldo a receber',data:serie.map(m=>m.saldo),borderColor:PALETA[0],backgroundColor:PALETA[0],tension:.3,pointRadius:2,fill:false}]},
    options:{scales:{y:{ticks:{callback:v=>fmtCompacto(v)},grid:{color:cssVar('--border')}},x:{grid:{display:false}}}}});
  const principalAberto=round2(calc.reduce((a,{r})=>a+r.principal,0)),jurosAberto=round2(calc.reduce((a,{r})=>a+r.juros,0));
  desenharGrafico('chartEmpComp',{type:'doughnut',
    data:{labels:['Principal em aberto','Juros acumulados'],datasets:[{data:[principalAberto,jurosAberto],
      backgroundColor:[PALETA[0],PALETA[3]],borderWidth:2,borderColor:cssVar('--surface')}]},
    options:{cutout:'58%',plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,boxHeight:10}}}}});
}
function renderDetalheContrato(){
  const box=$('#empDetalhe');if(!box)return;
  const ct=D().emprestimos.contratos.find(c=>c.id===EMP.contrato);
  if(!ct){box.innerHTML='';return;}
  const pessoa=D().emprestimos.pessoas.find(p=>p.id===ct.pessoaId);
  const r=calcContrato(ct),cron=cronogramaContrato(ct);
  const taxaDesde=ct.historicoTaxa&&ct.historicoTaxa.length>1?' · vigente desde '+fmtData(ct.historicoTaxa[ct.historicoTaxa.length-1].data):'';
  const historicoTaxaTxt=ct.historicoTaxa&&ct.historicoTaxa.length>1
    ?`<p class="tiny muted" style="margin:-4px 0 12px">Histórico de taxa: ${ct.historicoTaxa.map(p=>NUM.format(p.taxa)+'% desde '+fmtData(p.data)).join(' · ')}</p>`:'';
  box.innerHTML=`<div class="card">
    <div class="card-head"><h2>Contrato de ${esc(pessoa?.nome||'—')}</h2>
      <span class="tag">Início ${fmtData(ct.dataInicio)}</span><span class="tag">${NUM.format(ct.taxaMensal)}% ao mês${esc(taxaDesde)}</span>
      <button class="btn btn-sm btn-primary" id="ctNovoRegistro">Novo registro</button>
      <button class="icon-btn-sm" id="ctMais" aria-haspopup="true" aria-expanded="false" aria-label="Mais ações do contrato">${SVG_MAIS}</button>
      <button class="btn btn-sm btn-ghost" id="ctFechar">Fechar</button></div>
    <div class="card-pad">
      ${historicoTaxaTxt}
      <div class="kpi-row scroller" style="margin-bottom:14px">
        <div class="kpi k-brand"><div class="kpi-label">Principal</div><div class="kpi-value">${fmt(r.tot.principal)}</div></div>
        <div class="kpi k-pos"><div class="kpi-label">Recebido</div><div class="kpi-value">${fmt(r.tot.recebido)}</div></div>
        <div class="kpi k-brand"><div class="kpi-label">Juros gerados</div><div class="kpi-value">${fmt(r.tot.jurosGer)}</div></div>
        <div class="kpi k-neg"><div class="kpi-label">Saldo devedor hoje</div><div class="kpi-value">${fmt(r.saldo)}</div></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="histToggle" aria-expanded="${EMP.historicoAberto?'true':'false'}" aria-controls="histBody" style="gap:8px;margin:6px 0 8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;flex:none;transition:transform .15s;transform:rotate(${EMP.historicoAberto?90:0}deg)"><path d="M9 6l6 6-6 6"/></svg>
        <h3>Histórico detalhado <span class="tiny muted" style="font-weight:400">(${r.hist.length} ${r.hist.length===1?'registro':'registros'})</span></h3></button>
      <div id="histBody" class="${EMP.historicoAberto?'':'hide'}">
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Evento</th><th class="r">Valor</th>
        <th class="r">Juros pagos</th><th class="r">Amortização</th><th class="r">Saldo após</th><th>Observação</th><th class="r">Ações</th></tr></thead>
        <tbody>${r.hist.map(h=>`<tr><td>${fmtData(h.data)}</td>
          <td>${h.tipo==='emprestimo'?'<span class="tag">Valor emprestado</span>':'<span class="tag ok">Pagamento recebido</span>'}</td>
          <td class="r money">${fmt(h.valor)}</td><td class="r money">${h.jurosPagos?fmt(h.jurosPagos):'—'}</td>
          <td class="r money">${h.amort?fmt(h.amort):'—'}</td><td class="r money"><b>${fmt(h.saldo)}</b></td>
          <td>${esc(h.observacao||'—')}</td>
          <td class="r"><button class="icon-btn-sm" data-evtacoes="${h.id}" aria-haspopup="true" aria-expanded="false" aria-label="Mais ações do registro de ${fmtData(h.data)}">${SVG_MAIS}</button></td></tr>`).join('')}</tbody></table></div>
      </div>
      <h3 style="margin:18px 0 8px">Cronograma mensal</h3>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Mês</th><th class="r">Saldo inicial</th><th class="r">Juros do mês</th>
        <th class="r">Emprestado</th><th class="r">Recebido</th><th class="r">Saldo final</th><th>Situação</th></tr></thead>
        <tbody>${cron.map(l=>`<tr><td>${mesLabel(l.idx,false)}</td><td class="r money">${fmt(l.saldoIni)}</td>
          <td class="r money">${fmt(l.juros)}</td><td class="r money">${l.emprestado?fmt(l.emprestado):'—'}</td>
          <td class="r money">${l.recebido?fmt(l.recebido):'—'}</td><td class="r money"><b>${fmt(l.saldoFim)}</b></td>
          <td>${l.projetado?'<span class="tag fut">Projetado</span>':'<span class="tag ok">Realizado</span>'}</td></tr>`).join('')}</tbody></table></div>

  $('#ctNovoRegistro').onclick=()=>formEvento(ct);
  const excluirContrato=async()=>{
    if(await confirmar({titulo:'Excluir contrato',
      texto:`Excluir o contrato de ${esc(pessoa?.nome||'—')} iniciado em ${fmtData(ct.dataInicio)}? Todo o histórico de empréstimos e pagamentos deste contrato será perdido. Esta ação não pode ser desfeita.`,
      botao:'Excluir'})){
      D().emprestimos.contratos=D().emprestimos.contratos.filter(x=>x.id!==ct.id);
      EMP.contrato=null;salvar();toast('Contrato excluído.','ok');renderEmprestimos();}
  };
  const alterarTaxa=()=>{
    if(!ct.historicoTaxa||!ct.historicoTaxa.length)ct.historicoTaxa=[{data:ct.dataInicio,taxa:ct.taxaMensal}];
    const ultima=ct.historicoTaxa[ct.historicoTaxa.length-1];
    abrirModal({titulo:'Taxa mensal do contrato',pequeno:true,
      corpo:`<p class="small muted">Taxa atual: <b>${NUM.format(ct.taxaMensal)}% ao mês</b>, vigente desde ${fmtData(ultima.data)}.</p>
        <div class="field" style="margin-top:12px"><label for="tx">Nova taxa mensal de juros (%)</label>
          <input id="tx" class="input" type="number" step="0.01" min="0" max="20" value="${ct.taxaMensal}"></div>
        <div class="field" style="margin-top:12px"><label for="txData">Vigente a partir de</label>
          <input id="txData" class="input" type="date" value="${HOJE}" min="${ultima.data}"></div>
        <p class="tiny muted" style="margin-top:10px">Os juros já calculados antes dessa data continuam usando a taxa anterior — só o período a partir daqui passa a usar a taxa nova.</p>`,
      rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okTx">Salvar taxa</button>`,
      aoAbrir:m=>{$('#okTx',m).onclick=()=>{
        const novaData=$('#txData',m).value||HOJE;
        if(novaData<ultima.data){toast('A data de vigência não pode ser anterior à última mudança de taxa ('+fmtData(ultima.data)+').','err');return;}
        const novaTaxa=+$('#tx',m).value||0;
        if(novaData===ultima.data)ultima.taxa=novaTaxa;
        else ct.historicoTaxa.push({data:novaData,taxa:novaTaxa});
        ct.taxaMensal=novaTaxa;
        salvar();fecharModal();toast('Taxa atualizada. O histórico já calculado antes da vigência não muda.','ok');renderEmprestimos();};}});
  };
  $('#ctMais').onclick=e=>{e.stopPropagation();menuAcoes(e.currentTarget,[
    {texto:'Alterar taxa',icone:SVG_TAXA,aoClicar:alterarTaxa},
    {texto:'Exportar este contrato',icone:SVG_EXPORTAR,aoClicar:()=>abrirExportEmprestimos([ct],D().emprestimos.pessoas,[{c:ct,r}])},
    {texto:'Excluir contrato',icone:SVG_EXCLUIR,perigo:true,aoClicar:excluirContrato}
  ]);};
  $('#histToggle',box).onclick=()=>{EMP.historicoAberto=!EMP.historicoAberto;renderDetalheContrato();};
  $$('#histBody [data-evtacoes]',box).forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.evtacoes;
    menuAcoes(b,[
      {texto:'Editar',icone:SVG_EDITAR,aoClicar:()=>formEvento(ct,id)},
      {texto:'Excluir',icone:SVG_EXCLUIR,perigo:true,aoClicar:async()=>{
        if(await confirmar({titulo:'Excluir registro',
          texto:'Excluir este registro do histórico? O saldo do contrato será recalculado. Esta ação não pode ser desfeita.',
          botao:'Excluir'})){
          ct.eventos=ct.eventos.filter(ev=>ev.id!==id);
          salvar();toast('Registro excluído.','ok');renderEmprestimos();}
      }}
    ]);});
}

    corpo:`<div class="field"><label for="pNome">Nome</label><input id="pNome" class="input" placeholder="Nome completo"></div>
      <div class="field" style="margin-top:12px"><label for="pObs">Observação</label><input id="pObs" class="input" placeholder="Opcional"></div>`,
    rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okP">Salvar pessoa</button>`,
    aoAbrir:m=>{$('#okP',m).onclick=()=>{const n=$('#pNome',m).value.trim();
      if(!n){toast('Informe o nome.','err');return;}
      D().emprestimos.pessoas.push({id:uid('p'),nome:n,observacao:$('#pObs',m).value.trim(),criadoEm:HOJE});
      salvar();fecharModal();toast('Pessoa cadastrada.','ok');renderEmprestimos();};}});
}
function formContrato(){
  const pessoas=D().emprestimos.pessoas;
  if(!pessoas.length){toast('Cadastre uma pessoa antes de criar um contrato.','warn');return;}
  abrirModal({titulo:'Novo contrato de empréstimo',
    corpo:`<div class="form-grid">
      <div class="field"><label for="cPessoa">Pessoa</label><select id="cPessoa" class="input">${opcoes(pessoas)}</select></div>
      <div class="field"><label for="cValor">Valor emprestado</label><div class="with-prefix"><span class="prefix">R$</span><input id="cValor" class="input input-money" inputmode="numeric" placeholder="0,00"></div></div>
      <div class="field"><label for="cData">Data do empréstimo</label><input id="cData" class="input" type="date" value="${HOJE}"></div>
      <div class="field"><label for="cTaxa">Taxa mensal de juros (%)</label><input id="cTaxa" class="input" type="number" step="0.01" min="0" value="2"></div>
      <div class="field full"><label for="cObs">Observação</label><input id="cObs" class="input" placeholder="Opcional"></div></div>`,
    rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okC">Salvar contrato</button>`,
    aoAbrir:m=>{moedaMask($('#cValor',m));
      $('#okC',m).onclick=()=>{const v=lerMoeda($('#cValor',m));
        if(!v){toast('Informe o valor emprestado.','err');return;}
        const d=$('#cData',m).value||HOJE;
        const taxaIni=+$('#cTaxa',m).value||0;
        D().emprestimos.contratos.push({id:uid('ct'),pessoaId:$('#cPessoa',m).value,titulo:'Contrato '+fmtData(d),
          taxaMensal:taxaIni,dataInicio:d,observacao:$('#cObs',m).value.trim(),historicoTaxa:[{data:d,taxa:taxaIni}],
          eventos:[{id:uid('e'),tipo:'emprestimo',data:d,valor:v,observacao:'Valor inicial emprestado'}]});
        salvar();fecharModal();toast('Contrato criado.','ok');renderEmprestimos();};}});
}
function formEvento(ct,evtId=null){
  const evt=evtId?ct.eventos.find(e=>e.id===evtId):null;
  let tipoSel=evt?evt.tipo:'pagamento';
  const nota=()=>tipoSel==='pagamento'
    ?'O pagamento quita primeiro os juros acumulados e o restante amortiza o principal.'
    :'O valor entra como novo saldo emprestado, sujeito a juros a partir desta data.';
  abrirModal({titulo:evt?'Editar registro':'Novo registro',pequeno:true,
    corpo:`<div class="field"><label>Tipo de registro</label>
        <div class="seg" id="segTipoEvt" role="group" aria-label="Tipo de registro">
          <button type="button" data-v="pagamento" aria-pressed="${tipoSel==='pagamento'}">Pagamento recebido</button>
          <button type="button" data-v="emprestimo" aria-pressed="${tipoSel==='emprestimo'}">Empréstimo</button>
        </div></div>
      <div class="field" style="margin-top:12px"><label for="eValor">Valor</label><div class="with-prefix"><span class="prefix">R$</span><input id="eValor" class="input input-money" inputmode="numeric" placeholder="0,00" value="${evt?NUM.format(evt.valor):''}"></div></div>
      <div class="field" style="margin-top:12px"><label for="eData">Data</label><input id="eData" class="input" type="date" value="${evt?evt.data:HOJE}"></div>
      <div class="field" style="margin-top:12px"><label for="eObs">Observação</label><input id="eObs" class="input" placeholder="Opcional" value="${esc(evt?.observacao||'')}"></div>
      <p class="tiny muted" id="eNota" style="margin-top:10px">${nota()}</p>`,
    rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okE">Salvar</button>`,
    aoAbrir:m=>{moedaMask($('#eValor',m));
      $$('#segTipoEvt button',m).forEach(b=>b.onclick=()=>{
        tipoSel=b.dataset.v;
        $$('#segTipoEvt button',m).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
        $('#eNota',m).textContent=nota();
      });
      $('#okE',m).onclick=()=>{const v=lerMoeda($('#eValor',m));
        if(!v){toast('Informe o valor.','err');return;}
        const data=$('#eData',m).value||HOJE;
        const observacao=$('#eObs',m).value.trim()||(tipoSel==='emprestimo'?'Valor adicional emprestado':'Pagamento recebido');
        if(evt){Object.assign(evt,{tipo:tipoSel,valor:v,data,observacao});}
        else{ct.eventos.push({id:uid('e'),tipo:tipoSel,data,valor:v,observacao});}
        salvar();fecharModal();toast(evt?'Registro atualizado.':'Registro salvo.','ok');renderEmprestimos();};}});
}

/* ---- exportação de relatório (Excel/CSV e PDF via impressão) ---- */
function abrirExportEmprestimos(contratos,pessoas,calc){
  if(!contratos.length){toast('Nenhum contrato no filtro atual para exportar.','warn');return;}
  const escopoTxt='O relatório vai considerar os dados '+(EMP.filtroContrato?'do contrato selecionado'
    :EMP.filtroPessoa?'de '+(pessoas.find(p=>p.id===EMP.filtroPessoa)?.nome||'pessoa selecionada')
    :'de todos os contratos')+' — indicadores, gráficos, histórico completo de eventos e cronograma mês a mês de cada contrato.';
  abrirExportar({titulo:'Exportar relatório de empréstimos',escopoTxt,
    aoCsv:()=>exportarCsvEmprestimos(contratos,pessoas,calc),
    aoPdf:()=>exportarPdfEmprestimos(contratos,pessoas,calc)});
}
async function exportarCsvEmprestimos(contratos,pessoas,calc){
  const lin=[];
  const add=(...cols)=>lin.push(linhaCsv(...cols));
  add('Relatório de Empréstimos — Meu Fluxo · '+rotuloRelatorio());
  add('Gerado em',fmtData(HOJE));
  add('');
  add('Resumo por contrato');
  add('Pessoa','Início','Taxa mensal (%)','Principal','Recebido','Juros gerados','Saldo devedor hoje');
  calc.forEach(({c,r})=>{
    const p=pessoas.find(x=>x.id===c.pessoaId);
    add(p?.nome||'—',fmtData(c.dataInicio),NUM.format(c.taxaMensal),NUM.format(r.tot.principal),NUM.format(r.tot.recebido),NUM.format(r.tot.jurosGer),NUM.format(r.saldo));
  });
  add('');
  calc.forEach(({c,r})=>{
    const p=pessoas.find(x=>x.id===c.pessoaId);
    add('Histórico — '+(p?.nome||'—')+' · contrato de '+fmtData(c.dataInicio));
    add('Data','Evento','Valor','Juros pagos','Amortização','Saldo após','Observação');
    r.hist.forEach(h=>add(fmtData(h.data),h.tipo==='emprestimo'?'Valor emprestado':'Pagamento recebido',
      NUM.format(h.valor),h.jurosPagos?NUM.format(h.jurosPagos):'',h.amort?NUM.format(h.amort):'',NUM.format(h.saldo),h.observacao||''));
    const cron=cronogramaContrato(c);
    add('Cronograma mensal — '+(p?.nome||'—')+' · contrato de '+fmtData(c.dataInicio));
    add('Mês','Saldo inicial','Juros do mês','Emprestado','Recebido','Saldo final','Situação');
    cron.forEach(l=>add(mesLabel(l.idx,false),NUM.format(l.saldoIni),NUM.format(l.juros),
      l.emprestado?NUM.format(l.emprestado):'',l.recebido?NUM.format(l.recebido):'',NUM.format(l.saldoFim),l.projetado?'Projetado':'Realizado'));
    add('');
  });
  await salvarCsv('relatorio-emprestimos-'+HOJE+'.csv',lin);
}
function exportarPdfEmprestimos(contratos,pessoas,calc){
  const imgEvo=CHARTS['chartEmpEvo']?CHARTS['chartEmpEvo'].toBase64Image():null;
  const imgComp=CHARTS['chartEmpComp']?CHARTS['chartEmpComp'].toBase64Image():null;
  const escopoTxt=EMP.filtroContrato?'Contrato selecionado'
    :EMP.filtroPessoa?'Pessoa: '+(pessoas.find(p=>p.id===EMP.filtroPessoa)?.nome||'—')
    :'Todos os contratos';
  const T=calc.reduce((a,{r})=>({principal:round2(a.principal+r.tot.principal),saldo:round2(a.saldo+r.saldo),
    recebido:round2(a.recebido+r.tot.recebido),jurosGer:round2(a.jurosGer+r.tot.jurosGer)}),
    {principal:0,saldo:0,recebido:0,jurosGer:0});
  let html=`<div class="rel-print"><h1>Relatório de Empréstimos</h1>
    <p class="tiny muted">Meu Fluxo — ${esc(rotuloRelatorio())} · Gerado em ${fmtData(HOJE)} · Escopo: ${esc(escopoTxt)}</p>
    <div class="rel-kpis">
      <div><b>Principal emprestado</b><span>${fmt(T.principal)}</span></div>
      <div><b>Saldo total a receber</b><span>${fmt(T.saldo)}</span></div>
      <div><b>Total recebido</b><span>${fmt(T.recebido)}</span></div>
      <div><b>Juros gerados</b><span>${fmt(T.jurosGer)}</span></div>
    </div>`;
  if(imgEvo)html+=`<h2>Evolução do saldo</h2><img src="${imgEvo}">`;
  if(imgComp)html+=`<h2>Composição do saldo</h2><img src="${imgComp}" style="max-width:320px">`;
  calc.forEach(({c,r})=>{
    const p=pessoas.find(x=>x.id===c.pessoaId);
    const cron=cronogramaContrato(c);
    html+=`<h2 style="margin-top:22px">${esc(p?.nome||'—')} — contrato de ${fmtData(c.dataInicio)} (${NUM.format(c.taxaMensal)}% ao mês)</h2>
      <table><thead><tr><th>Data</th><th>Evento</th><th>Valor</th><th>Juros pagos</th><th>Amortização</th><th>Saldo após</th><th>Observação</th></tr></thead>
      <tbody>${r.hist.map(h=>`<tr><td>${fmtData(h.data)}</td><td>${h.tipo==='emprestimo'?'Emprestado':'Pagamento'}</td><td>${fmt(h.valor)}</td>
        <td>${h.jurosPagos?fmt(h.jurosPagos):'—'}</td><td>${h.amort?fmt(h.amort):'—'}</td><td>${fmt(h.saldo)}</td><td>${esc(h.observacao||'—')}</td></tr>`).join('')}</tbody></table>
      <table style="margin-top:8px"><thead><tr><th>Mês</th><th>Saldo inicial</th><th>Juros</th><th>Emprestado</th><th>Recebido</th><th>Saldo final</th><th>Situação</th></tr></thead>
      <tbody>${cron.map(l=>`<tr><td>${mesLabel(l.idx,false)}</td><td>${fmt(l.saldoIni)}</td><td>${fmt(l.juros)}</td>
        <td>${l.emprestado?fmt(l.emprestado):'—'}</td><td>${l.recebido?fmt(l.recebido):'—'}</td><td>${fmt(l.saldoFim)}</td><td>${l.projetado?'Projetado':'Realizado'}</td></tr>`).join('')}</tbody></table>`;
  });
  html+='</div>';
  imprimirRelatorio(html);
}

function cardConta(c){
  return `<div class="mini-card" data-id="${c.id}">
    <div class="mini-top">
      <div style="min-width:0"><b>${esc(c.banco)}</b>
        <div class="tiny muted">${esc(c.tipo)}</div></div>

     <span>Os saldos abaixo são informados manualmente e não são conciliados com a Base de Lançamentos nesta versão. Valores a receber de empréstimos aparecem separados porque ainda não são dinheiro líquido.</span></div>

       <div class="tiny muted">Empréstimos selecionados</div></div>
     <div class="kpi k-brand"><div class="kpi-label">Juros acumulados a receber</div><div class="kpi-value">${fmt(jurosReceber)}</div>
       <div class="tiny muted">Mais ${fmt(jurosProj)} projetados em 3 meses</div></div>
     <div class="kpi k-brand"><div class="kpi-label">Capital ampliado projetado</div><div class="kpi-value">${fmt(ampliado)}</div>

   </div>
   <div class="split" style="margin-bottom:14px">
     <div class="card"><div class="card-head"><h2>Contas e saldos</h2>
       <button class="icon-btn" id="capExportar" aria-label="Exportar dados de capital e liquidez">${SVG_EXPORTAR}</button>

     <div class="card"><div class="card-head"><h2>Distribuição do capital</h2></div>

   </div>

  $('#capTabela').innerHTML=contas.length?`<table class="tbl"><thead><tr><th>Banco ou instituição</th><th>Tipo de conta</th>
      <th class="r">Saldo atual</th><th>Atualizado em</th><th>Observação</th><th class="r">Ações</th></tr></thead>
    <tbody>${contas.map(c=>`<tr><td><b>${esc(c.banco)}</b></td><td>${esc(c.tipo)}</td><td class="r money">${fmt(c.saldo)}</td>

      if(await confirmar({titulo:'Excluir conta',texto:'A conta e o histórico de atualizações serão removidos. Continuar?',botao:'Excluir'})){
        D().capital.contas=D().capital.contas.filter(c=>c.id!==b.dataset.acoes);salvar();toast('Conta excluída.','ok');renderCapital();}}}
  ]));
  $$('#capReceber [data-rec]').forEach(c=>c.onchange=()=>{c.checked?CAP.receber.add(c.dataset.rec):CAP.receber.delete(c.dataset.rec);renderCapital();});

  if(contas.length){

    desenharGrafico('chartCapInst',{type:'bar',data:{labels:contas.map(c=>c.banco),
        datasets:[{label:'Saldo',data:contas.map(c=>c.saldo),backgroundColor:PALETA[0],borderRadius:4}]},

      datasets:contas.map((c,i)=>({label:c.banco,data:meses.map(m=>{const h=[...c.historico].filter(x=>mesIndex(x.data)<=m).pop();return h?h.saldo:null;}),
        borderColor:PALETA[i%PALETA.length],backgroundColor:PALETA[i%PALETA.length],tension:.3,pointRadius:2,spanGaps:true}))},
    options:{scales:{y:{ticks:{callback:v=>fmtCompacto(v)},grid:{color:cssVar('--border')}},x:{grid:{display:false}}},

}
function formConta(){
  abrirModal({titulo:'Nova conta',
    corpo:`<div class="form-grid">
      <div class="field"><label for="bBanco">Banco ou instituição</label><input id="bBanco" class="input" placeholder="Ex.: Banco Azul"></div>
      <div class="field"><label for="bTipo">Tipo de conta</label><select id="bTipo" class="input">
        ${opcoes(['Conta corrente','Conta de pagamento','Poupança','Conta salário','Carteira digital'])}</select></div>
      <div class="field"><label for="bSaldo">Saldo atual</label><div class="with-prefix"><span class="prefix">R$</span><input id="bSaldo" class="input input-money" inputmode="numeric" placeholder="0,00"></div></div>
      <div class="field"><label for="bData">Data da atualização</label><input id="bData" class="input" type="date" value="${HOJE}"></div>
      <div class="field full"><label for="bObs">Observação</label><input id="bObs" class="input" placeholder="Opcional"></div></div>`,
    rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okB">Salvar conta</button>`,
    aoAbrir:m=>{moedaMask($('#bSaldo',m));
      $('#okB',m).onclick=()=>{const b=$('#bBanco',m).value.trim();
        if(!b){toast('Informe o banco ou instituição.','err');return;}
        const s=lerMoeda($('#bSaldo',m)),d=$('#bData',m).value||HOJE;
        D().capital.contas.push({id:uid('b'),banco:b,tipo:$('#bTipo',m).value,saldo:s,dataAtualizacao:d,
          observacao:$('#bObs',m).value.trim(),historico:[{data:d,saldo:s}]});
        salvar();fecharModal();toast('Conta cadastrada.','ok');renderCapital();};}});
}
function formAtualizarSaldo(id){
  const c=D().capital.contas.find(x=>x.id===id);
  abrirModal({titulo:'Atualizar saldo — '+c.banco,pequeno:true,
    corpo:`<p class="small muted">Saldo atual: <b class="money">${fmt(c.saldo)}</b> (informado em ${fmtData(c.dataAtualizacao)})</p>
      <div class="field" style="margin-top:12px"><label for="nSaldo">Novo saldo</label>
        <div class="with-prefix"><span class="prefix">R$</span><input id="nSaldo" class="input input-money" inputmode="numeric" value="${NUM.format(c.saldo)}"></div></div>
      <div class="field" style="margin-top:12px"><label for="nData">Data da atualização</label><input id="nData" class="input" type="date" value="${HOJE}"></div>
      <div class="field" style="margin-top:12px"><label for="nObs">Observação</label><input id="nObs" class="input" value="${esc(c.observacao||'')}"></div>`,
    rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okS">Salvar saldo</button>`,
    aoAbrir:m=>{moedaMask($('#nSaldo',m));
      $('#okS',m).onclick=()=>{const v=lerMoeda($('#nSaldo',m)),d=$('#nData',m).value||HOJE;
        c.saldo=v;c.dataAtualizacao=d;c.observacao=$('#nObs',m).value.trim();
        c.historico.push({data:d,saldo:v});c.historico.sort((a,b)=>a.data<b.data?-1:1);
        salvar();fecharModal();toast('Saldo atualizado. O histórico guardou a alteração.','ok');renderCapital();};}});
}
function verHistoricoConta(id){
  const c=D().capital.contas.find(x=>x.id===id);
  abrirModal({titulo:'Histórico — '+c.banco,pequeno:true,
    corpo:`<div class="preview-list">${[...c.historico].reverse().map(h=>`<div><span>${fmtData(h.data)}</span><b>${fmt(h.saldo)}</b></div>`).join('')}</div>
      <p class="tiny muted" style="margin-top:10px">Cada linha é uma atualização manual registrada.</p>`,
    rodape:`<button class="btn" data-fechar>Fechar</button>`});
}
/* ---------- exportação de Capital e Liquidez ---------- */
function exportarCapital({contas,disponivel,calc,principalReceber,jurosReceber,jurosProj,ampliado}){
  if(!contas.length){toast('Nenhuma conta cadastrada para exportar.','warn');return;}
  const escopoTxt='Indicadores de liquidez, contas e saldos informados, distribuição por instituição, evolução dos saldos e recebíveis de empréstimos marcados para o capital ampliado.';
  abrirExportar({titulo:'Exportar capital e liquidez',escopoTxt,
    aoCsv:()=>exportarCsvCapital({contas,disponivel,calc,principalReceber,jurosReceber,jurosProj,ampliado}),
    aoPdf:()=>exportarPdfCapital({contas,disponivel,calc,principalReceber,jurosReceber,jurosProj,ampliado})});
}
async function exportarCsvCapital({contas,disponivel,calc,principalReceber,jurosReceber,jurosProj,ampliado}){
  const lin=[];const add=(...c)=>lin.push(linhaCsv(...c));
  add('Relatório — Capital e Liquidez · Meu Fluxo · '+rotuloRelatorio());
  add('Gerado em',fmtData(HOJE));
  add('');
  add('Indicadores');
  add('Capital líquido disponível',NUM.format(disponivel));
  add('Principal a receber',NUM.format(principalReceber));
  add('Juros acumulados a receber',NUM.format(jurosReceber));
  add('Juros projetados em 3 meses',NUM.format(jurosProj));
  add('Capital ampliado projetado',NUM.format(ampliado));
  add('');
  add('Contas e saldos');
  add('Banco ou instituição','Tipo de conta','Saldo atual','Atualizado em','Observação');
  contas.forEach(c=>add(c.banco,c.tipo,NUM.format(c.saldo),fmtData(c.dataAtualizacao),c.observacao||''));
  if(calc.length){
    add('');
    add('Recebíveis de empréstimos');
    add('Pessoa','Contrato de','Principal','Juros','Saldo devedor','No capital ampliado');
    calc.forEach(({c,r})=>{
      const p=D().emprestimos.pessoas.find(x=>x.id===c.pessoaId);
      add(p?.nome||'—',fmtData(c.dataInicio),NUM.format(r.principal),NUM.format(r.juros),NUM.format(r.saldo),CAP.receber.has(c.id)?'Sim':'Não');
    });
  }
  await salvarCsv('relatorio-capital-'+HOJE+'.csv',lin);
}
function exportarPdfCapital({contas,disponivel,calc,principalReceber,jurosReceber,jurosProj,ampliado}){
  const imgDist=CHARTS['chartCapDist']?CHARTS['chartCapDist'].toBase64Image():null;
  const imgEvo=CHARTS['chartCapEvo']?CHARTS['chartCapEvo'].toBase64Image():null;
  const imgInst=CHARTS['chartCapInst']?CHARTS['chartCapInst'].toBase64Image():null;
  let html=`<div class="rel-print"><h1>Capital e Liquidez</h1>
    <p class="tiny muted">Meu Fluxo — ${esc(rotuloRelatorio())} · Gerado em ${fmtData(HOJE)}</p>
    <div class="rel-kpis">
      <div><b>Capital líquido disponível</b><span>${fmt(disponivel)}</span></div>
      <div><b>Principal a receber</b><span>${fmt(principalReceber)}</span></div>
      <div><b>Juros acumulados a receber</b><span>${fmt(jurosReceber)}</span></div>
      <div><b>Capital ampliado projetado</b><span>${fmt(ampliado)}</span></div>
    </div>
    <h2 style="margin-top:22px">Contas e saldos</h2>
    <table><thead><tr><th>Banco ou instituição</th><th>Tipo de conta</th><th>Saldo atual</th><th>Atualizado em</th><th>Observação</th></tr></thead>
    <tbody>${contas.map(c=>`<tr><td>${esc(c.banco)}</td><td>${esc(c.tipo)}</td><td>${fmt(c.saldo)}</td><td>${fmtData(c.dataAtualizacao)}</td><td>${esc(c.observacao||'—')}</td></tr>`).join('')}</tbody></table>`;
  if(imgDist)html+=`<h2>Distribuição do capital</h2><img src="${imgDist}" style="max-width:360px">`;
  if(imgEvo)html+=`<h2>Evolução dos saldos informados</h2><img src="${imgEvo}">`;
  if(imgInst)html+=`<h2>Capital por instituição</h2><img src="${imgInst}">`;
  if(calc.length){
    html+=`<h2 style="margin-top:22px">Recebíveis de empréstimos</h2>
      <table><thead><tr><th>Pessoa</th><th>Contrato de</th><th>Principal</th><th>Juros</th><th>Saldo devedor</th><th>No capital ampliado</th></tr></thead>
      <tbody>${calc.map(({c,r})=>{const p=D().emprestimos.pessoas.find(x=>x.id===c.pessoaId);
        return `<tr><td>${esc(p?.nome||'—')}</td><td>${fmtData(c.dataInicio)}</td><td>${fmt(r.principal)}</td><td>${fmt(r.juros)}</td><td>${fmt(r.saldo)}</td><td>${CAP.receber.has(c.id)?'Sim':'Não'}</td></tr>`;}).join('')}</tbody></table>`;
  }
  html+=`</div>`;
  imprimirRelatorio(html);
}

<script>

function formCadastro(chave,idx=null){
  const rotulos={cartoes:'cartão',instituicoes:'instituição',veiculos:'veículo',formas:'forma de pagamento'};
  const it=idx!==null?D()[chave][idx]:null;
  const ehVeic=chave==='veiculos',ehTxt=chave==='formas';
  abrirModal({titulo:(idx!==null?'Editar ':'Novo ')+rotulos[chave],pequeno:true,
    corpo:`<div class="field"><label for="itNome">Nome</label><input id="itNome" class="input" value="${esc(it?(typeof it==='string'?it:it.nome):'')}"></div>
      ${ehVeic?`<div class="field" style="margin-top:12px"><label for="itTipo">Tipo</label>
        <select id="itTipo" class="input">${opcoes(['Carro','Moto','Utilitário','Outro'],{selecionado:it?.tipo||'Carro'})}</select></div>
        <div class="field" style="margin-top:12px"><label for="itPlaca">Placa</label><input id="itPlaca" class="input" value="${esc(it?.placa||'')}"></div>`:''}`,
    rodape:`<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="okIt">Salvar</button>`,
    aoAbrir:m=>{$('#okIt',m).onclick=()=>{const n=$('#itNome',m).value.trim();
      if(!n){toast('Informe o nome.','err');return;}
      if(ehTxt){if(idx!==null)D().formas[idx]=n;else D().formas.push(n);}

/* ---------------------- notificações ---------------------- */
/* Notificações são SEMPRE recalculadas a partir dos lançamentos atuais:
   - vencimentos vêm só dos lançamentos DESTE perfil (nunca dos totais do
     parceiro), um aviso por lançamento, identificado por id+data+valor;
   - mudar data, valor ou situação gera outra chave, então o aviso antigo some
     e o novo aparece como não lido; excluir remove o aviso. */
function chaveNotif(a){return a.chave||('t:'+a.titulo+'|'+a.texto);}
function listaNotificacoes(){
  const out=[];
  const limite=addMeses(HOJE,1);
  const proximas=soRegistros(D().lancamentos).filter(l=>situacao(l)==='futuro'&&l.dataParcela<=limite)
    .sort((a,b)=>a.dataParcela<b.dataParcela?-1:a.dataParcela>b.dataParcela?1:(a.id<b.id?-1:1)).slice(0,5);
  proximas.forEach(l=>out.push({chave:'v:'+l.id+':'+l.dataParcela+':'+l.valor+':'+l.tipo,nivel:l.tipo==='entrada'?'pos':'warn',
    titulo:`${l.tipo==='entrada'?'Entrada prevista':'Saída prevista'} em ${fmtData(l.dataParcela)}`,
    texto:`${l.observacao||nomeCat(l.categoriaId)} — ${fmt(l.valor)}${l.parcelasTotal?` (parcela ${l.parcelaAtual} de ${l.parcelasTotal})`:''}`}));
  const iv={ini:MES_ATUAL,fim:MES_ATUAL};
  pontosAtencao(iv).filter(a=>a.nivel==='neg'||a.nivel==='warn').slice(0,3)
    .forEach(a=>out.push({nivel:a.nivel,titulo:a.titulo,texto:a.texto}));
  const emAberto=D().emprestimos.contratos.map(c=>calcContrato(c)).filter(r=>r.saldo>0.5);
  if(emAberto.length)out.push({nivel:'info',titulo:'Empréstimos em aberto',
    texto:`${emAberto.length} ${emAberto.length===1?'contrato soma':'contratos somam'} ${fmt(round2(emAberto.reduce((a,r)=>a+r.saldo,0)))} a receber.`});
  return out;
}
/* "Lido" é guardado por aviso (lista de chaves vistas), não mais como um
   único sim/não: um aviso novo ou alterado volta a acender o ponto. */
function notifVistas(){const v=D().notifLidas;return Array.isArray(v)?v:[];}
function atualizarNotif(){
  if(!DB.usuarioAtual||!D())return;
  const itens=listaNotificacoes(),vistas=new Set(notifVistas());
  const naoLidas=itens.filter(a=>!vistas.has(chaveNotif(a))).length;
  $('#notifDot').classList.toggle('hide',!naoLidas);
  $('#btnNotif').setAttribute('aria-label',naoLidas?`Notificações: ${naoLidas} nova(s) de ${itens.length}`:`Notificações (${itens.length})`);
}
function abrirNotificacoes(){
  const itens=listaNotificacoes();
  const chaves=itens.map(chaveNotif),antes=notifVistas();
  if(chaves.some(k=>!antes.includes(k))||antes.length!==chaves.length){D().notifLidas=chaves;salvar();}
  atualizarNotif();
  abrirDrawer(`<div class="modal-head"><h2>Notificações</h2>
      <button class="icon-btn" data-fechar aria-label="Fechar notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${itens.length?itens.map(a=>`<div class="alert-item">
      <span class="alert-ico a-${a.nivel}" aria-hidden="true">${a.nivel==='neg'?'!':a.nivel==='pos'?'✓':a.nivel==='warn'?'▲':'i'}</span>
      <div><p><b>${esc(a.titulo)}</b></p><p class="small muted">${esc(a.texto)}</p></div></div>`).join('')
      :'<p class="muted small">Nada por aqui no momento.</p>'}
      <p class="tiny muted" style="margin-top:14px">Avisos calculados a partir dos seus próprios lançamentos, inclusive no modo casal. Nada é enviado por e-mail ou mensagem.</p></div>`);
}

/* ============================================================================
   Módulo "Análise do casal" — só existe no modo casal.
   Recorte: despesas MARCADAS como do casal, de 1º/09/2026 em diante.
   Os dados de Henrique vêm dos registros dele; os da parceira, do agregado
   mensal publicado no caminho compartilhado. Nenhum registro individual da
   outra pessoa existe aqui.
   ========================================================================== */
const CAS={de:null,ate:null,vista:'bar',veic:'todos'};
const MES_INI_CASAL_IDX=mesIdxDe(2026,9);   // início do CONSOLIDADO; as marcações usam todo o histórico

/* Uma linha por (mês, tipo, grupo, categoria, dono) já filtrada pelo recorte. */
function baseCasal(){
  const meus=D().lancamentos
    .filter(l=>l.casal&&l.tipo==='saida'&&situacao(l)!=='cancelado')
    .map(l=>({mes:mesIndex(l.dataParcela),tipo:'saida',grupoId:l.grupoId,categoriaId:l.categoriaId,
      valor:+l.valor||0,qtd:1,dono:DB.usuarioAtual,futuro:situacao(l)==='futuro'?+l.valor||0:0}));
  const deles=PARCEIRO.lista
    .filter(l=>l.tipo==='saida'&&(l.casalValor||0)>0)
    .map(l=>({mes:mesIndex(l.dataParcela),tipo:'saida',grupoId:l.grupoId,categoriaId:l.categoriaId,
      valor:l.casalValor,qtd:l._qtdCasal||0,dono:PARCEIRO.id,futuro:0}));
  return meus.concat(deles);
}
/* Veículos dos dois perfis, com o dono de cada um. Os meus vêm dos meus
   lançamentos; os do parceiro, do total mensal publicado por ele(a). */
function veiculosCasal(){
  const eu=DB.usuarioAtual,out=[];
  const meus=agregarVeiculos(D());
  meus.veiculos.forEach(v=>out.push({...v,dono:eu,chave:eu+':'+v.id}));
  const pv=PARCEIRO.veic;
  if(pv&&Array.isArray(pv.veiculos))pv.veiculos.forEach(v=>out.push({...v,dono:PARCEIRO.id,chave:PARCEIRO.id+':'+v.id}));
  const linhas=[];
  const add=(fonte,dono)=>Object.entries(fonte&&fonte.meses||{}).forEach(([m,vs])=>
    Object.entries(vs).forEach(([vid,r])=>linhas.push({mes:mesIndex(m+'-01'),chave:dono+':'+vid,dono,total:+r.total||0,
      operacional:+r.operacional||0,qtd:r.qtd|0,cats:r.cats||{}})));
  add(meus,eu);add(pv,PARCEIRO.id);
  return {veiculos:out,linhas};
}
function periodoCasal(){
  const disp=baseCasal().map(x=>x.mes).concat(veiculosCasal().linhas.map(x=>x.mes));
  const min=disp.length?Math.min(...disp):MES_ATUAL;
  const max=Math.max(MES_ATUAL,disp.length?Math.max(...disp):MES_ATUAL);
  let de=CAS.de==null?min:Math.max(min,CAS.de);
  let ate=CAS.ate==null?max:Math.min(max,CAS.ate);
  if(ate<de)ate=de;
  return {de,ate,min,max};
}
/* Dias realmente cobertos pelo período, para a média diária ser honesta:
   o mês corrente conta só até hoje. */
function diasDoPeriodo(de,ate){
  let n=0;
  for(let i=de;i<=ate;i++){
    const y=Math.floor(i/12),m=i%12+1;
    const noMes=new Date(Date.UTC(y,m,0)).getUTCDate();
    if(i===MES_ATUAL)n+=Math.min(HOJE_P.d,noMes);
    else if(i<MES_ATUAL)n+=noMes;
  }
  return Math.max(n,1);
}
function somaCasal(linhas){return round2(linhas.reduce((a,x)=>a+x.valor,0));}
function agruparCasal(linhas,campo){
  const m=new Map();
  linhas.forEach(x=>{const k=x[campo]||'—';const r=m.get(k)||{id:k,valor:0,qtd:0};
    r.valor=round2(r.valor+x.valor);r.qtd+=x.qtd;m.set(k,r);});
  const arr=[...m.values()].sort((a,b)=>b.valor-a.valor);
  const tot=somaCasal(linhas);
  arr.forEach(x=>{x.pct=tot?round2(x.valor/tot*100):0;
    x.nome=campo==='grupoId'?nomeGrupoCasal(x.id):nomeCatCasal(x.id);});
  return {itens:arr,total:tot};
}
/* Nomes: o catálogo do parceiro chega junto do agregado, então uma categoria
   criada só por ele(a) ainda tem nome legível aqui. */
function nomeCatCasal(id){
  const c=D().categorias.find(x=>x.id===id)||catParc('categorias').find(x=>x.id===id);
  return c?c.nome:'Sem categoria';
}
function nomeGrupoCasal(id){
  const g=D().grupos.find(x=>x.id===id)||catParc('grupos').find(x=>x.id===id);
  return g?g.nome:'Sem grupo';
}
