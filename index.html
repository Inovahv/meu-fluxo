      <div class="card-pad" id="casAtencao"></div></div>`;

  $('#casDe').onchange=e=>{CAS.de=+e.target.value;if(CAS.ate!=null&&CAS.ate<CAS.de)CAS.ate=CAS.de;renderCasal();};
  $('#casAte').onchange=e=>{CAS.ate=+e.target.value;if(CAS.de!=null&&CAS.de>CAS.ate)CAS.de=CAS.ate;renderCasal();};
  $('#casLimpar').onclick=()=>{CAS.de=null;CAS.ate=null;renderCasal();};
  $$('#segCas button').forEach(b=>b.onclick=()=>{CAS.vista=b.dataset.v;renderCasal();});
  renderVeiculosCasal(de,ate);

  if(!todas.length){
    $('#casEvo').innerHTML=vazio('Nenhuma despesa marcada ainda',
      'Marque "É do casal" ao criar um lançamento, ou use a coluna Casal na Base de lançamentos. Só entram despesas com data a partir de 1º de setembro de 2026.');
    $('#casGrupoBox').innerHTML=vazio('Sem dados','Nada a agrupar por enquanto.');
    $('#casCatBox').innerHTML=vazio('Sem dados','Nada a agrupar por enquanto.');
    $('#casPeso').innerHTML=vazio('Sem dados','As categorias aparecem assim que houver despesas marcadas.');
    $('#casAtencao').innerHTML=vazio('Sem leituras','Os alertas surgem quando houver histórico suficiente.');
    return;
  }
  if(!linhas.length){
    $('#casEvo').innerHTML=vazio('Nenhuma despesa no período escolhido','Amplie o intervalo ou use “Todo o período”.');
    $('#casGrupoBox').innerHTML=vazio('Sem dados no filtro','');
    $('#casCatBox').innerHTML=vazio('Sem dados no filtro','');
    $('#casPeso').innerHTML=vazio('Sem dados no filtro','');
    $('#casAtencao').innerHTML=vazio('Sem leituras no filtro','');
    return;
  }

  // ---- evolução ----
  const serie=[];
  for(let i=de;i<=ate;i++){
    const doMes=linhas.filter(x=>x.mes===i);
    serie.push({idx:i,label:mesLabel(i),total:somaCasal(doMes),
      meu:somaCasal(doMes.filter(x=>x.dono===DB.usuarioAtual)),
      dele:somaCasal(doMes.filter(x=>x.dono!==DB.usuarioAtual))});
  }
  const wrap=$('#casEvo');
  if(CAS.vista==='cards'){
    const teto=Math.max(...serie.map(m=>m.total),1);
    wrap.innerHTML=`<div class="timeline" id="casTimeline" tabindex="0" role="group" aria-label="Linha do tempo das despesas do casal">
      ${serie.map(m=>{
        const acima=m.total>mediaMes*1.0001;
        return `<div class="tl-card ${acima?'tl-neg':'tl-zero'}${m.idx===MES_ATUAL?' tl-hoje':''}">
        <div class="tl-head"><b>${mesLabel(m.idx,false)}</b>${m.idx===MES_ATUAL?'<span class="tl-flag">Atual</span>':''}</div>
        <div class="tl-res ${acima?'neg':''}"><span aria-hidden="true">${acima?'▲':'—'}</span>${fmt(m.total)}</div>
        <div class="tl-bars">
          <div class="tl-bar"><span>Você</span><span class="trk"><span style="width:${Math.max(m.meu/teto*100,m.meu>0?3:0)}%;background:${PALETA[0]}"></span></span><span class="val">${fmtCompacto(m.meu)}</span></div>
          <div class="tl-bar"><span>${esc(nomeParceiro()).slice(0,9)}</span><span class="trk"><span style="width:${Math.max(m.dele/teto*100,m.dele>0?3:0)}%;background:#7D6BA8"></span></span><span class="val">${fmtCompacto(m.dele)}</span></div>
        </div>
        <div class="tl-foot"><span>Ante a média</span><span class="money">${mediaMes?fmtPct(round2((m.total-mediaMes)/mediaMes*100)):'—'}</span></div>
      </div>`;}).join('')}</div>`;
    ativarArraste($('#casTimeline'));
  }else{
    const largura=Math.max(serie.length*86,520);
    wrap.innerHTML=`<div class="chart-fixed">
      <div class="axis-col" id="casAxis" aria-hidden="true"></div>
      <div class="chart-scroll" id="casScroll" tabindex="0" role="group" aria-label="Gráfico de evolução, arraste na horizontal">
        <div class="chart-inner" style="min-width:${largura}px;position:relative">
          <canvas id="casChart" role="img" aria-label="Despesas do casal por mês"></canvas></div></div></div>`;
    desenharGrafico('casChart',{type:CAS.vista==='line'?'line':'bar',
      data:{labels:serie.map(m=>m.label),datasets:[
        {label:'Você',data:serie.map(m=>m.meu),backgroundColor:PALETA[0],borderColor:PALETA[0],borderRadius:4,tension:.3,stack:'a'},
        {label:nomeParceiro(),data:serie.map(m=>m.dele),backgroundColor:'#7D6BA8',borderColor:'#7D6BA8',borderRadius:4,tension:.3,stack:'a'}]},
      options:{scales:{
          y:{stacked:CAS.vista!=='line',ticks:{display:false},border:{display:false},grid:{color:cssVar('--border')},afterFit(sc){sc.width=0;}},
          x:{stacked:CAS.vista!=='line',grid:{display:false}}},
        plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,boxHeight:10,padding:9}},
          tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}}}});
    sincronizarEixoFixo('casChart','casAxis');
    ativarArraste($('#casScroll'));
  }

  // ---- grupo e categoria ----
  const porG=agruparCasal(linhas,'grupoId'),porC=agruparCasal(linhas,'categoriaId');
  const desenhaBarras=(box,dados,rot)=>{
    const el=$(box);
    if(!dados.itens.length){el.innerHTML=vazio('Sem dados','');return;}
    const itens=dados.itens.slice(0,10),cores=itens.map((_,i)=>PALETA[i%PALETA.length]);
    el.innerHTML=`<canvas id="${box.slice(1)}Cv" role="img" aria-label="Despesas do casal ${rot}"></canvas>`;
    desenharGrafico(box.slice(1)+'Cv',{type:'bar',
      data:{labels:itens.map(i=>i.nome),datasets:[{label:'Despesas do casal',data:itens.map(i=>i.valor),backgroundColor:cores,borderRadius:5}]},
      options:{indexAxis:'y',scales:{x:{ticks:{callback:v=>fmtCompacto(v)},grid:{color:cssVar('--border')}},y:{grid:{display:false}}},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${fmt(c.parsed.x)} · ${NUM.format(itens[c.dataIndex].pct)}% do recorte`}}}}});
  };
  desenhaBarras('#casGrupoBox',porG,'por grupo');
  desenhaBarras('#casCatBox',porC,'por categoria');

  // ---- peso no orçamento ----
  $('#casPeso').innerHTML=`<table class="tbl"><thead><tr><th>Categoria</th><th>Grupo</th>
      <th class="r">Total</th><th class="r">% do recorte</th><th class="r">Média mensal</th><th class="r">Despesas</th></tr></thead>
    <tbody>${porC.itens.slice(0,12).map(x=>{
      const g=D().categorias.find(c=>c.id===x.id)||catParc('categorias').find(c=>c.id===x.id);
      return `<tr><td>${esc(x.nome)}</td><td>${esc(g?nomeGrupoCasal(g.grupoId):'—')}</td>
        <td class="r money"><b>${fmt(x.valor)}</b></td><td class="r">${NUM.format(x.pct)}%</td>
        <td class="r money">${fmt(round2(x.valor/nMeses))}</td><td class="r">${x.qtd||'—'}</td></tr>`;}).join('')}</tbody></table>`;

  // ---- pontos de atenção ----
  const alertas=[];
  if(temAnterior&&varPct!=null&&Math.abs(varPct)>=10){
    alertas.push({nivel:varPct>0?'neg':'pos',titulo:varPct>0?'Gasto do casal subiu.':'Gasto do casal caiu.',
      texto:`${fmtPct(Math.abs(varPct))} ${varPct>0?'acima':'abaixo'} do período anterior.`,
      base:`${fmt(total)} em ${mesLabel(de,false)}–${mesLabel(ate,false)} contra ${fmt(totalAnt)} em ${mesLabel(antDe,false)}–${mesLabel(antAte,false)}.`});
  }
  const topo=porC.itens[0];
  if(topo&&topo.pct>=35){
    alertas.push({nivel:'warn',titulo:'Concentração em uma categoria.',
      texto:`${topo.nome} responde por ${NUM.format(topo.pct)}% das despesas do casal.`,
      base:`${fmt(topo.valor)} de ${fmt(total)} no período.`});
  }
  const acima=serie.filter(m=>m.total>mediaMes*1.2);
  if(acima.length&&nMeses>=3){
    alertas.push({nivel:'warn',titulo:acima.length===1?'Um mês acima da média.':`${acima.length} meses acima da média.`,
      texto:`${acima.map(m=>mesLabel(m.idx,false)).join(', ')} ${acima.length===1?'passou':'passaram'} de 20% acima da média mensal.`,
      base:`Média do período: ${fmt(mediaMes)} por mês.`});
  }
  const recorrentes=porC.itens.filter(x=>x.qtd>=nMeses&&nMeses>=2);
  if(recorrentes.length){
    alertas.push({nivel:'info',titulo:'Despesas que se repetem todo mês.',
      texto:`${recorrentes.slice(0,3).map(x=>x.nome).join(', ')} ${recorrentes.length>3?'e outras ':''}aparecem ao menos uma vez por mês no recorte.`,
      base:`Somadas, representam ${fmt(round2(recorrentes.reduce((a,x)=>a+x.valor,0)))} no período.`});
  }
  if(!PARCEIRO.lista.length){
    alertas.push({nivel:'info',titulo:`${nomeParceiro()} ainda não marcou despesas.`,
      texto:'Os números acima consideram apenas as suas marcações.',
      base:'A soma passa a incluir os dois assim que houver marcações dos dois lados.'});
  }
  $('#casAtencao').innerHTML=alertas.length?alertas.map(a=>`<div class="alert-item">
      <span class="alert-ico a-${a.nivel}" aria-hidden="true">${a.nivel==='neg'?'!':a.nivel==='pos'?'✓':a.nivel==='warn'?'▲':'i'}</span>
      <div><p><b>${esc(a.titulo)}</b> ${esc(a.texto)}</p><div class="tiny">${esc(a.base)}</div></div></div>`).join('')
    :vazio('Nada a sinalizar','Os números do período não apresentam variações ou concentrações relevantes.');
}

</script>
</body>
</html>
